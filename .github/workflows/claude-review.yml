# Advisory PR code review by Claude Code (BE-0203).
#
# This makes Claude Code the automated PR reviewer (replacing GitHub Copilot after a parallel
# migration; see docs/ai-development.md): Claude Code reviews against *this repository's* contract
# (.github/claude-review-prompt.md — the three prime directives, the docstring standard, the
# bilingual-docs rule, the BE-ID lifecycle) and posts inline line-level comments only — no top-level
# summary, which would leave stale, contradictory overviews across a PR's several runs — via the
# action's native inline-comment tool (see the claude_args allowlist below).
#
# WHEN IT RUNS (BE-0347): automatically when a PR opens or reopens, and after that only when a
# maintainer or collaborator asks, by writing `@claude review` on the PR — typically the `pr-followup`
# skill itself, once its local two-role self-review of the pushed fix comes back clean. It deliberately
# does NOT re-review on every push (`synchronize` is not in the trigger's types): a per-push re-review
# can post a finding on the fix for its own previous finding, so the fix-push-review cycle need never
# converge, and the follow-up loop that waits for the PR to go quiet then has no exit. Requesting the
# pass instead puts a bounded, locally-reviewed change in front of it each time. The workflow stays
# rather than being removed, because two paths never go through that local pass and would otherwise
# get no review at all: a fork PR (whose `pull_request` run carries no secrets by design, so `@claude
# review` from a maintainer is its only review), and any commit pushed outside these Claude Code
# skills.
#
# Every event — the automatic open/reopen run and the on-demand comment runs alike — gets the same
# contract prompt and the same prior-findings input, so a requested pass is not a weaker review than
# an automatic one. To stop it repeating the SAME findings across a PR's runs while still missing
# nothing, each run reads the FULL diff (so no changed line goes unreviewed) but is also handed every
# finding already posted on the PR (the "Compute the review inputs" step below) and told never to
# re-post one — it dedupes by suppressing repeats, not by narrowing what it looks at. A genuinely new
# issue, even on code an earlier run overlooked, is still raised. The on-demand path is gated to
# trusted actors (OWNER / MEMBER / COLLABORATOR), so a comment from anyone else is ignored — and
# because that drop is silent, a requester must confirm the run's `claude review` job actually started
# (a dropped request still leaves a completed green run with that job `skipped`, since the gate is a
# job-level `if:`) rather than reading the silence as a clean review.
#
# HARD BOUNDARY (prime directive 1): this review is *advisory*. It is deliberately NOT added to
# `main`'s branch-protection `required_status_checks`, and the job's own result is decoupled from
# the findings — a review that *found issues* is a successful review, so the job goes red only on an
# infrastructure failure, never on "the reviewer disliked the code". The deterministic `check` /
# `E2E` gates remain the only merge arbiters; this adds a reviewer, never a judge.
#
# Auth is the vendor-neutral provider BE-0104 selects, picked at run time from the `claude-review`
# Environment (the gate step below): a Claude Code subscription (the `CLAUDE_CODE_OAUTH_TOKEN`
# secret, generated by `claude setup-token`, BE-0163) is preferred when present; otherwise Amazon
# Bedrock, reached by exchanging the workflow's GitHub OIDC token for short-lived AWS credentials
# (the `AWS_BEDROCK_ROLE_ARN` secret, no static key). With neither configured the job is a green
# no-op, so no PR is ever red while a credential is being provisioned. A plain `pull_request` event
# from a fork does not expose secrets by GitHub's design, so auto-review covers same-repo
# `claude/<topic>` / `<user>/<topic>` branches; fork PRs are reviewed on demand by a maintainer. We
# deliberately do NOT use `pull_request_target` (it would run with secrets against untrusted fork
# code).
name: Claude review

on:
  pull_request:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Minimum the surface needs: read the diff, post review comments, and mint the OIDC token the
# Bedrock credential exchange requires (unused on the subscription path, harmless there). Nothing
# else.
permissions:
  contents: read
  pull-requests: write
  id-token: write

# The group is split by event type, and cancel-in-progress is true only for `pull_request` — so a
# reopen supersedes a still-running open review, while comment-triggered runs stay independent.
# Independent is the deliberate choice for them, not an oversight: a comment posted mid-review (a bot
# reply, a reviewer note, even `@claude review` itself) sharing the group would cancel the running
# review and surface a red "cancelled" check on a pass someone explicitly asked for. The cost is that
# two on-demand requests in quick succession run concurrently rather than superseding each other; each
# still reads the prior findings and suppresses repeats, so the overlap costs Actions minutes, not
# duplicate comments.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # NOTE: this job's name is intentionally NOT listed in main's required_status_checks — the review
  # is advisory and must never gate a merge (prime directive 1). Keep it off that list.
  review:
    name: claude review
    runs-on: ubuntu-latest
    # Fail fast instead of GitHub's 360-minute default: a live review runs in ~7 min, so a run that
    # far exceeds this is a hang (provider outage, runaway tool loop) — cap it rather than tie up a
    # runner and burn Actions minutes for hours.
    timeout-minutes: 20
    # Auto-review on the open/reopen events the trigger still carries; every later pass comes through
    # the on-demand path, which is hardened against fork-PR secret exposure: a comment event runs only
    # when it is a PR comment, contains the `@claude review` phrase, AND comes from a trusted actor
    # (OWNER/MEMBER/COLLABORATOR). Because `issue_comment` runs with repo secrets even on fork PRs,
    # restricting the association is what stops an untrusted commenter from triggering a credentialed
    # run.
    if: >-
      github.event_name == 'pull_request' ||
      (
        (
          (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
          github.event_name == 'pull_request_review_comment'
        ) &&
        contains(github.event.comment.body, '@claude review') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    # Scope the review credential to this Environment so an unrelated job can't read it.
    environment: claude-review
    steps:
      - name: Pick the AI provider (or no-op)
        id: gate
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ROLE_ARN: ${{ secrets.AWS_BEDROCK_ROLE_ARN }}
          MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
        run: |
          # Prefer the Claude Code subscription (OAuth) when its token is present; otherwise use
          # Amazon Bedrock via OIDC. Enable each provider only when ALL of its required inputs are
          # present — Bedrock needs both the role ARN and the model id — so a half-configured
          # Environment stays a dormant no-op rather than running and failing (which would turn the
          # advisory check red on config drift). Same all-or-nothing shape as roadmap-id.yml (BE-0089).
          if [ -n "$OAUTH_TOKEN" ]; then
            echo "provider=oauth" >> "$GITHUB_OUTPUT"
          elif [ -n "$ROLE_ARN" ] && [ -n "$MODEL_ID" ]; then
            echo "provider=bedrock" >> "$GITHUB_OUTPUT"
          else
            echo "provider=none" >> "$GITHUB_OUTPUT"
            if [ -n "$ROLE_ARN" ] && [ -z "$MODEL_ID" ]; then
              echo "::notice::AWS_BEDROCK_ROLE_ARN is set but the BEDROCK_MODEL_ID variable is missing — advisory Claude review is dormant (BE-0203). No-op."
            elif [ -z "$ROLE_ARN" ] && [ -n "$MODEL_ID" ]; then
              echo "::notice::BEDROCK_MODEL_ID is set but the AWS_BEDROCK_ROLE_ARN secret is missing — advisory Claude review is dormant (BE-0203). No-op."
            else
              echo "::notice::Neither CLAUDE_CODE_OAUTH_TOKEN nor AWS_BEDROCK_ROLE_ARN (+ BEDROCK_MODEL_ID) is set — advisory Claude review is dormant (BE-0203). No-op."
            fi
          fi

      # Check out the DEFAULT branch, never the untrusted PR head. This job holds the review
      # credential (OAuth token / Bedrock role) and write scope, so checking out PR-authored code
      # here is the CodeQL "untrusted checkout in a privileged context" / TOCTOU risk (a fork PR
      # could carry a hostile `.github/claude-review-prompt.md` or code). The review never needs the
      # head checked out: it reads the change set with `gh pr diff` (below) and posts via the API.
      # The default branch is the canonical, trusted home of the review contract — the same version
      # for every PR regardless of its target base (and it resolves on comment events too, which
      # carry no PR base in their payload). `persist-credentials: false` keeps the checkout from
      # carrying a usable token.
      - name: Check out the default branch (trusted) for the review contract
        if: steps.gate.outputs.provider != 'none'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Compute WHAT the reviewer dedupes against, at the mechanism level — the prompt used to just
      # say "on a re-run, comment only on what the latest push changed", yet the run re-read the whole
      # PR diff (`gh pr diff`) every time. A non-deterministic reviewer re-reading the full diff
      # each time re-mines unchanged code and dribbles fresh findings, so the review never settles —
      # but narrowing WHAT it reads to only the pushed delta would make it MISS a real problem outside
      # that delta. So keep it reading the full diff (miss nothing) and instead hand it the findings
      # already posted inline, with an instruction never to re-post one — it dedupes by suppressing
      # repeats, not by narrowing its view. Fetching prior findings here is reliable where the
      # prompt's own `gh pr view --comments` is not (that does not return inline review comments
      # reliably), and needs no PR-head checkout, so the "never check out untrusted head" property
      # (above) holds.
      #
      # This runs for EVERY event, not just `pull_request` (BE-0347). An on-demand run is now the
      # common case rather than the exception, and one starting with an empty prior-findings list
      # would re-post findings already settled on the PR — exactly the churn the narrowed trigger
      # exists to stop. The PR number therefore comes from whichever payload carries it: `issue_comment`
      # has only `issue.number`, while `pull_request` and `pull_request_review_comment` carry
      # `pull_request.number`. It is re-emitted as an output so the review prompt below can address
      # the same PR without repeating the fallback.
      - name: Compute the review inputs (prior findings)
        id: inputs
        if: steps.gate.outputs.provider != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          # Every finding already posted inline on this PR, compacted to `path:line — first body line`.
          # The review reads the FULL diff on every run so no changed line ever goes unreviewed (missing
          # a real problem is the failure to avoid); it dedupes by never re-posting a finding on this
          # list, NOT by narrowing what it looks at. Cap generously so a long-running PR's history fits;
          # `printf -v` (not a heredoc, whose column-0 body would close this YAML block scalar) builds
          # the multi-line value.
          PRIOR=$(gh api --paginate "repos/$REPO/pulls/$PR/comments" \
            --jq '.[] | select(.body | startswith("🤖 **Claude Code**")) | "- " + .path + ":" + ((.line // .original_line // 0)|tostring) + " — " + (.body|split("\n")[0])' \
            | head -c 32000 || true)
          if [ -n "$PRIOR" ]; then
            printf -v PRIOR_SECTION '%s\n%s' \
              'The following findings are ALREADY posted as inline comments on this PR. Do NOT repeat, restate, or re-post any of them — match by file and line and by substance, and treat them as settled. Every OTHER real issue you find anywhere in the diff you must still raise, even on code an earlier pass overlooked.' \
              "$PRIOR"
          else
            PRIOR_SECTION=""
          fi

          {
            echo "prior_section<<__BAJUTSU_EOF__"
            printf '%s\n' "$PRIOR_SECTION"
            echo "__BAJUTSU_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Exchange OIDC token for Bedrock AWS credentials
        if: steps.gate.outputs.provider == 'bedrock'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Run the advisory Claude review
        if: steps.gate.outputs.provider != 'none'
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b  # v1.0.183
        env:
          # Bedrock needs an explicit model id (a Bedrock inference-profile id); set it as the
          # `BEDROCK_MODEL_ID` Environment variable alongside the role ARN — point it at an Opus
          # profile to match the subscription path. Empty on the subscription path, where claude_args
          # pins the model to `opus` instead.
          ANTHROPIC_MODEL: ${{ steps.gate.outputs.provider == 'bedrock' && vars.BEDROCK_MODEL_ID || '' }}
        with:
          # Exactly one provider is active per run: on 'oauth' the token authenticates and
          # use_bedrock is false; on 'bedrock' the token is empty and use_bedrock is true.
          use_bedrock: ${{ steps.gate.outputs.provider == 'bedrock' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The action rejects any non-human (Bot/App) actor unless it is allow-listed, so PRs opened
          # by our own automation bot (bajutsu-automation-bot — roadmap-refresh, docs-refresh, etc.)
          # would otherwise fail the review with "Workflow initiated by non-human actor". A push from
          # GitHub's own Copilot coding agent (actor `Copilot`, commits authored as
          # `copilot-swe-agent[bot]`) hits the same gate — it only runs when a repo owner/collaborator
          # explicitly assigns it, the same trust boundary as our own bot. Allow-list exactly these two
          # trusted actors rather than using '*' (which the action warns can let external Apps invoke
          # it with attacker-controlled prompts on public repos). The match is case-insensitive and
          # strips a trailing `[bot]`, so this covers every spelling each actor uses.
          allowed_bots: "bajutsu-automation-bot,Copilot"
          # Inline comments post through the action's native tool (the action buffers and posts them);
          # the diff read and discussion read go through the narrowly-scoped `gh pr …` commands. The
          # built-in `/code-review` skill posts via unrestricted `gh` (Bash), which the action sandboxes
          # out — so we grant exactly these tools instead. We deliberately do NOT grant `gh pr comment`:
          # the review posts inline findings only, no top-level summary — a fresh summary from each of a
          # PR's runs leaves stale, contradictory overviews on it, so withholding the tool enforces the
          # rule.
          # Run the review on Opus, not the action's default Sonnet: sharper severity triage means
          # fewer low-value nitpicks and higher-quality findings, at ~1.67x the per-token cost. On the
          # subscription (OAuth) path pass the `opus` alias here; on Bedrock the model is the
          # BEDROCK_MODEL_ID inference-profile the org configures (point it at an Opus profile).
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
            ${{ steps.gate.outputs.provider == 'oauth' && '--model opus' || '' }}
          # Review against the repo-flavored contract and post inline via the native tool. The reviewer
          # reads the FULL diff every run so no changed line is missed; {1} lists the findings already
          # on the PR so it dedupes by not re-posting them, not by narrowing what it looks at.
          #
          # This prompt is now supplied on EVERY event, comment events included (BE-0347). A comment
          # event used to pass an empty prompt and fall through to the action's default `@claude`
          # mention handling — which would have run the on-demand path, now the common one, without the
          # contract, its functional-impact severity floor, its `🤖 **Claude Code**` prefix, or the
          # dedup input. A requested pass is the same review as an automatic one, not a weaker one. The
          # trade-off is that `@claude review` in a review-thread reply also runs a full contract pass
          # rather than answering that thread alone; the dedup input keeps it from re-raising what the
          # thread already settled.
          prompt: ${{ format('Review this pull request (#{0}) as an advisory (non-gating) reviewer. Read the review contract at .github/claude-review-prompt.md and follow it exactly, including its "Identify yourself as Claude Code" rule (prefix every inline comment so the review reads as Claude Code, since it posts under github-actions[bot]). Read the diff with `gh pr diff {0}` and review the ENTIRE diff exhaustively in this single pass — raise every finding at once, and do NOT treat unchanged code as settled just because an earlier run did not flag it; if you find a real issue anywhere in the diff, raise it, so nothing is missed. {1} Post each finding as an inline comment with the mcp__github_inline_comment__create_inline_comment tool, adding a GitHub suggestion block wherever a concrete, mechanical fix fits. Do NOT post any top-level summary comment — post inline findings only, because a fresh summary from each of this PR''s runs leaves stale, contradictory overviews on it. If nothing warrants a comment, post nothing. This review is advisory only, never a merge gate.', steps.inputs.outputs.pr, steps.inputs.outputs.prior_section) }}

  # Ship the wording-only findings the review just posted as a companion PR instead of making the
  # author push them here (BE-0343). A `(non-blocking, prose)` finding is never a correctness bug,
  # yet fixing it on this PR re-runs its whole CI matrix for a change with no behavioral risk. So
  # this job applies each such finding's own `suggestion` block to a companion branch rebuilt from
  # this PR's head, and opens that against this PR's branch — the fix is reviewable and mergeable
  # while this PR is still open, on its own small terms.
  #
  # NO LLM RUNS HERE (prime directive 1, with more room to spare than the review above): the review
  # step already drafted the fix text, so this only matches it against the current head and splices
  # it in, skipping — never guessing — where the line has since changed. `needs: review` orders it
  # after that run's findings have posted.
  prose-companion:
    name: prose companion PR
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This runs on the on-demand comment events too, not only `pull_request` (BE-0347). With the
    # automatic trigger narrowed to open/reopen, a `pull_request`-only condition would leave every
    # wording finding raised after the open event with no job to apply it — BE-0343 would work once
    # per PR and never again. The condition mirrors the review job's own trusted-actor gate, so a
    # comment that could not have started a review cannot start a companion either.
    #
    # The two trust guards this job has always applied — a same-repo head, and not a `prose-fix/`
    # companion branch — move into the "Resolve the pull request's head" step below, because an
    # `issue_comment` payload carries neither. They are unchanged in substance: this job writes to a
    # PR-authored branch under a privileged App token, a materially different risk from
    # roadmap-id.yml's and refresh.yml's use of that token against the already-trusted `main`, so it
    # stays confined to branches only an OWNER/MEMBER/COLLABORATOR can push. (It no longer *checks
    # out* that branch — see the apply step below — but the write is reason enough to keep the gate.)
    # A fork PR's wording findings stay unautomated, the same gap the review already accepts. And a
    # companion PR is itself reviewed (it is opened by an allow-listed bot), so without the
    # `prose-fix/` exclusion a prose
    # finding on one would open a companion of the companion, and so on; excluding the branch prefix
    # stops that at one level, and a wording finding on a companion is fixed there by hand, which is
    # cheap — it carries no CI matrix worth avoiding.
    #
    # `!cancelled()` rather than the implicit success(): the review posts its findings as it goes, so
    # a provider error late in that step must not strand findings it already posted. A run superseded
    # by a reopen IS cancelled, and there the newer run does the work instead.
    if: >-
      !cancelled() &&
      (
        github.event_name == 'pull_request' ||
        (
          (
            (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
            github.event_name == 'pull_request_review_comment'
          ) &&
          contains(github.event.comment.body, '@claude review') &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    environment: claude-review
    # Every write goes through the App token, so the default GITHUB_TOKEN needs read only — plus the
    # `pull-requests: read` the head resolution below needs, which a `pull_request` payload used to
    # supply for free. Still narrower than the workflow-level grant the review job needs for posting.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require the automation App (or no-op)
        id: gate
        env:
          APP_ID: ${{ secrets.AUTOMATION_BOT_APP_ID }}
          APP_KEY: ${{ secrets.AUTOMATION_BOT_PRIVATE_KEY }}
        run: |
          # The App identity is what makes the companion PR trigger its own `check` CI (a PR opened
          # with GITHUB_TOKEN does not) — without it the companion would be unreviewable, so a
          # half-provisioned repo stays a green no-op rather than opening a useless PR.
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AUTOMATION_BOT_APP_ID / AUTOMATION_BOT_PRIVATE_KEY are not both set — the prose companion PR is dormant (BE-0343). No-op."
          fi

      # Which PR this run is about, and whether it is eligible. A `pull_request` payload carries the
      # head outright, but an on-demand `issue_comment` one carries only the issue number, so resolve
      # it through the API and apply the same two guards the job's `if:` used to (same-repo head, not a
      # `prose-fix/` companion). Resolving here rather than minting the App token first keeps an
      # ineligible PR from ever reaching the privileged steps below.
      - name: Resolve the pull request's head and eligibility
        id: pr
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          # Assign first so `set -e` fails the step on an API error — a here-string would swallow it
          # (its own exit status is `read`'s, and the command substitution's is discarded).
          # A branch name cannot contain whitespace, so a tab-separated read splits these three safely.
          head_tsv=$(gh api "repos/$REPO/pulls/$PR" \
            --jq '[.head.repo.full_name, .head.ref, .head.sha] | @tsv')
          read -r head_repo head_ref head_sha <<<"$head_tsv"
          {
            echo "number=$PR"
            echo "head_ref=$head_ref"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"
          if [ "$head_repo" != "$REPO" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #$PR is from a fork ($head_repo) — the prose companion PR stays same-repo only (BE-0343). No-op."
          elif [ "${head_ref#prose-fix/}" != "$head_ref" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #$PR is itself a companion branch ($head_ref) — not opening a companion of a companion (BE-0343). No-op."
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint a short-lived installation token for the automation App
        if: steps.pr.outputs.eligible == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.AUTOMATION_BOT_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_BOT_PRIVATE_KEY }}

      # The only checkout this job makes, and it is the DEFAULT branch — the script that runs under
      # the App token, never the PR head, so a same-repo branch cannot rewrite what this privileged
      # job executes. It is stdlib-only and runs on the runner's own `python3`, which is also why no
      # `uv sync` (and therefore no PR-authored `pyproject.toml` build hook) is involved.
      - name: Check out the default branch (trusted) for the companion script
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # The PR head is never checked out. It reaches the script only as data — the files a finding
      # names, read back at HEAD_SHA through the contents API — and the companion commit is assembled
      # through the Git Data API (blob, tree, commit, ref). So this privileged job holds no
      # pull-request-authored working tree at all, which is what CodeQL's
      # `actions/untrusted-checkout-toctou` flagged when the head *was* checked out here beside the
      # App token. Reads pin the resolved SHA, not the branch, so a push landing mid-run cannot shift
      # the text a finding is matched against; the commit's parent is that same SHA, which is how the
      # companion branch stays rebuilt from the CURRENT head with nothing carried over between runs.
      - name: Apply the wording findings and open or update the companion PR
        if: steps.pr.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PR: ${{ steps.pr.outputs.number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          python3 scripts/prose_companion_pr.py \
            --pr "$PR" --source-branch "$HEAD_REF" --head-sha "$HEAD_SHA" \
            --bot-name "${APP_SLUG}[bot]" \
            --bot-email "${APP_SLUG}[bot]@users.noreply.github.com"
