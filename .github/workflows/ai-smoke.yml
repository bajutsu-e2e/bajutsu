# The live-model lane — manual, opt-in, dormant by default. Two jobs, both non-gating signals:
# the AI backend adapters' real-API contract smoke (BE-0300), and the system-alert guard's
# real-model accuracy check (BE-0308).
#
# tests/test_ai_backend_live_smoke.py calls a real provider through Bajutsu's own adapter code
# (`bajutsu.common.ai.anthropic.AnthropicBackend`) with a trivial forced-tool prompt and asserts only that
# the reply lands as a populated, parseable neutral `MessageResponse` — a transport-and-schema check,
# never a claim about what the model said. Every other adapter test drives a hand-written
# `FakeAnthropic`, so nothing else re-observes the live API's actual shape. No LLM touches the `run` /
# CI verdict (prime directive 1): this exercises the AI *authoring* periphery alone.
#
# HARD BOUNDARY: `workflow_dispatch` only — never on push or pull_request, so a fork-triggered run can
# never see the credential (the boundary .github/workflows/devicefarm.yml already draws). It is not a
# required check; following the BE-0282 precedent it lands as a non-gating signal.
#
# Auth is the `ANTHROPIC_API_KEY` repository secret, scoped to the `ai-smoke` Environment. With it
# unset the live test skips itself (`credential_gap` reports the missing key) and the job is a green
# no-op, so the lane stays dormant until an operator wires the secret up. Only the direct Anthropic
# API adapter is wired here: Bedrock needs a live AWS role and `ant` a signed-in OAuth CLI seat,
# neither realistically available as a CI secret — the item's Progress log records that gap. Their
# tests still run locally / manually via `pytest -m live` when the credential is present.
#
# tests/test_real_model_alerts.py asks the other half of the live question (BE-0308): not whether the
# transport round-trips, but whether the *answer* is right. It shows the vision alert locator real
# system dialogs captured from the showcase app and asserts its coordinates land inside the correct
# dismiss control's frame — the guard's actual safety claim, which every other test of it takes on
# faith by handing it an `AlertDecision` its own author typed. It needs no Simulator: the dialogs are
# committed captures under `tests/fixtures/be0308/`, so only the model call is live. The guard is a
# Tier 1 live-AI operation and stays one — nothing here reaches the `run` / CI verdict.
name: AI live-model signals

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-api:
    name: smoke (direct Anthropic API)
    runs-on: ubuntu-latest
    # A single Anthropic call needs little; bound it so a hung live request can't run to
    # Actions' 6h default and hold the ai-smoke Environment lock.
    timeout-minutes: 15
    environment: ai-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      # The dev group already pulls in `bajutsu[ai,...]` (the anthropic SDK) plus pytest — the same
      # gate env `ci.yml` installs — so `--group dev` alone covers the live smoke's needs. No
      # Simulator or browser extra is added; those stay out of the dev group.
      - name: Install the gate env (includes the AI extra + test tooling)
        run: uv sync --group dev

      # `-m live` overrides the default `-m 'not ... and not live'` (pyproject addopts) so the suite —
      # deselected everywhere else — actually runs here. `-n0` overrides `-n auto`: a single real call
      # gains nothing from xdist workers. With the key unset the test skips and the job stays green.
      - name: Real-API wire contract (direct Anthropic API)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run --no-sync pytest tests/test_ai_backend_live_smoke.py -m live -n0 -v

  alert-guard:
    name: accuracy (system-alert guard)
    runs-on: ubuntu-latest
    # One vision call per committed fixture, so a handful of calls; the same bound as the job above
    # keeps a hung request from holding the ai-smoke Environment lock for Actions' 6h default.
    timeout-minutes: 15
    environment: ai-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      # The dev group covers this too: the fixtures are committed PNGs and the locator reaches the
      # model through the same `bajutsu[ai,...]` adapter the job above uses. No Simulator, no browser
      # extra — the dialogs were captured once, on a Mac, by hand.
      - name: Install the gate env (includes the AI extra + test tooling)
        run: uv sync --group dev

      # `-m live` overrides the default `-m 'not ... and not live'` (pyproject addopts); `-n0` because
      # a few real vision calls gain nothing from xdist workers. With the key unset every case skips
      # and the job is a green no-op, exactly like the smoke job above.
      - name: Vision locator accuracy over real captured alerts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run --no-sync pytest tests/test_real_model_alerts.py -m live -n0 -v
