# On-device iOS E2E (macOS + Simulator) — the iOS backend's lane, mirroring android-e2e.yml
# (adb) and web-e2e.yml (Playwright) in scope, but unlike them this lane carries the platform's
# REQUIRED status check: the `E2E` job below always reports (even when the macOS jobs are
# path-gated skipped), so it — not this file's name — is what `main`'s branch-protection ruleset
# pins. Nine macOS jobs, all on the XCUITest backend (the resident BajutsuRunner), against the
# showcase suite (BE-0079, the single iOS fixture). One `build` job compiles the apps + runner once
# and uploads them as an artifact; the consumer jobs (run / actuation / golden / bundled-runner /
# conformance) download + install rather than build, so the cold Swift build is paid once, not
# once per job. Each macOS job starts with the same bootstrap (select Xcode, install uv, install
# xcodegen, boot a Simulator — the `build` job skips the boot — resolve the Xcode version for a
# cache key) via the `setup-ios-toolchain` composite action. `codegen` and `visual` are not
# consumers (they compile a different product) and stay self-contained:
#   - run (xcuitest): the homogeneous gating lane — every `bajutsu run`-over-XCUITest scenario that
#     used to be its own job (smoke, gestures, the runner channel's /type + /swipe + /back, and the
#     deterministic permissions surface) folded into one `bajutsu run`. They differed only in which
#     scenarios they ran, so each re-paid the lane's dominant fixed cost — the cold XCTest-host
#     startup plus its own build and boot — over again; one job warm-reuses the resident runner
#     across the fourteen scenario documents that run — every scenario the eight files hold, since BE-0315
#     made the notification grant native so nothing is `ai`-tagged to exclude (BE-0291/BE-0287/BE-0315)
#     — paying that cold startup seven times (the lane caps warm reuse
#     at 1, see the `env` block below) — three more than the four separate jobs' cold startups summed
#     to, but each of those jobs also paid its own build and boot, which the `build` job below now
#     pays once for the whole lane.
#     `run` reddens the gate if any scenario
#     fails, so per-scenario pass/fail moves from job names into its report. Covers BE-0019 (pinch/
#     rotate, /gesture), BE-0281 (/type, /swipe, /back), BE-0276 (`permissions`: location, pre-granted
#     with no prompt), BE-0315 (the native reactive `systemAlertHandling` notification grant), and BE-0316
#     (`handleSystemAlert` taps the SpringBoard "Allow" by native query).
#   - actuation (xcuitest): real on-device XCUITest actuation beyond `tap` (BE-0281) — `back` and
#     device control (setLocation / clipboard / push) on the Stable launch tab — plus the
#     scenario-authoring features on a real backend (BE-0285): `extract`, `forEach` over a mutating
#     tree, data-driven rows, and `relaunch`. Deliberately NOT part of the `E2E` gate's `needs:` (like
#     `golden` / `visual`): new coverage lands as a per-PR signal first (Simulator flakiness, BE-0218)
#     and is promoted to the gate only once stable.
#   - golden (xcuitest): the BE-0006 element-tree golden over XCUITest, the iOS twin of
#     android-e2e.yml's `golden (adb)`. Like `visual`, deliberately NOT part of the `E2E` gate's
#     `needs:` — the tree golden is deterministic and host-independent, so a drift surfaces here as
#     a per-PR signal without blocking a merge.
#   - codegen (xcuitest): generate a native XCUITest from a scenario and run it with
#     xcodebuild — no bajutsu / AI at test time (the codegen output path). It compiles
#     components.yaml and (BE-0297) the wider DSL surface (text-editing / gestures / multi-touch /
#     coordinate-swipe / drag / compound selectors), reusing scenarios already proven on-device;
#     both steps gate the job, the wider slice having proven stable as a non-gating signal first.
#   - bundled-runner (xcuitest): the bundled-runner path (BE-0292) — the same resident runner
#     resolved from the wheel bundle rather than a config `testRunner`, against both the SwiftUI
#     and UIKit a11y apps (the runner is app-agnostic, BE-0019), proving a Simulator run needs no
#     runner-build and no runner path. Kept its own job — a distinct config and two targets, not
#     just different scenarios, so it does not fold into `run`.
#   - conformance (xcuitest): the driver conformance suite (BE-0114) on-device against the XCUITest
#     backend. Kept its own job — a pytest-ondevice harness, not a `bajutsu run`.
#   - fault-injection (xcuitest): real fault injection for the runner channel (BE-0305). Every job
#     above drives a *healthy* runner, so BE-0207's transient retry and BE-0287's crash recovery are
#     exercised only by a synthetic exception in the fast suite; this one signals the real runner
#     process — frozen briefly, frozen past the retry budget, killed — and checks each layer behaves.
#     Deliberately NOT part of the `E2E` gate's `needs:` (see that job below): a lane that breaks the
#     runner on purpose lands as a signal first and is promoted once stable (BE-0282's precedent).
#   - visual (xcuitest): the iOS twin of android-e2e.yml's `visual` — a pixel VRT of the Stable
#     catalog against the committed `baselines_ios/` baseline. Deliberately NOT part of the `E2E`
#     gate's `needs:` (see that job below) — a pixel baseline is host-specific (the Simulator
#     renderer varies by Xcode / device / OS), so a drift surfaces here as a signal, never
#     blocking a merge, the same rationale android-e2e.yml's `visual` and web-e2e.yml's jobs
#     follow for their own non-required lanes.
#   - `run` is itself the second consolidation of this lane: smoke / gestures / permission /
#     runner-actuation were once separate jobs (and earlier still one `xcuitest-gestures` job), each
#     re-paying the cold XCTest-host startup — the lane's dominant cost. Folding them back into one
#     `bajutsu run` trades per-concern job names for paying that cold startup far fewer times, now
#     that the run loop's per-scenario verdict makes the split unnecessary for the gate.
# The SwiftUI a11y product is the run / golden / codegen / visual subject; the UIKit twin shares
# the identifier contract, so one toolkit suffices for the gate (bundled-runner is the exception —
# it deliberately runs both toolkits to prove the runner is app-agnostic).
# The BE-0006 element-tree goldens live on the showcase
# (demos/showcase/scenarios/golden/, ported in BE-0079's retirement).
# Runs on every relevant PR and on demand (the Actions tab / `gh workflow run ios-e2e.yml`).
name: iOS E2E (Simulator)

on:
  workflow_dispatch:
  # Trigger on every PR so the `e2e` gate job always reports a status (required checks
  # that never run stay pending and block merges). The metered macOS jobs themselves are
  # path-gated by the `changes` job below — docs-only PRs skip them and the gate passes.
  pull_request:
  # Also run in the merge queue: `E2E` is a required check, and a required check that
  # never reports on `merge_group` leaves the queue entry pending until it times out.
  # The `changes` job uses the merge group's SHAs so path-gating still applies here.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ios-e2e-${{ github.ref }}
  cancel-in-progress: true

# Capture the XCUITest runner subprocess's stdout/stderr (folded together) on every on-device job.
# Without it the runner's output goes to DEVNULL, so a startup timeout ("xcuitest runner did not come
# up within Ns") is undiagnosable — we can't tell a crash from a hang from a slow XCTest host, and a
# *mid-run* runner crash (see `_MAX_WARM_REUSES` in `bajutsu/platform_lifecycle/environments/xcuitest.py`
# for what this repeatedly surfaced on this PR's CI runs) leaves no trace of what the runner did.
# With capture on, a startup-timeout warning carries the log's tail inline
# (bajutsu/platform_lifecycle/environments/xcuitest.py), and the file itself is retained for any
# failure. The directory sits *under* `runs/` on purpose: every on-device job already uploads `runs/`
# as its artifact, so the runner log rides along and is downloadable after any failure — a mid-run
# crash included, where there is no startup-timeout to log a tail. `github.workspace` (not
# `runner.temp`, which is unavailable in workflow-level env) keys it to the checkout.
#
# BAJUTSU_XCUITEST_STARTUP_TIMEOUT raises the cold-runner startup ceiling from the 120s default to
# 300s (5 minutes) for every on-device lane: `xcodebuild test-without-building` boots the XCTest host
# and launches the app before the runner answers /health, and on a loaded/contended macOS runner that
# first start can exceed 120s. A warm start still returns the instant /health is ready, so this only
# raises the ceiling for the cold case (bajutsu/platform_lifecycle/environments/xcuitest.py). The
# ceiling is shared across the two cold-spawn attempts unless the device was repaired in between, in
# which case the retry restarts it — see BAJUTSU_XCUITEST_RECOVERY_TIMEOUT below for the worst-case
# arithmetic this lane's `timeout-minutes` are set against.
env:
  BAJUTSU_XCUITEST_RUNNER_LOG: ${{ github.workspace }}/runs/runner-logs
  # BAJUTSU_XCUITEST_RESULT_BUNDLES puts one `.xcresult` per runner spawn beside that log (BE-0361
  # unit 1). The captured stdout above paraphrases an XCTest failure; the bundle is what testmanagerd
  # itself recorded — the precise failure, its timestamps, and any attachments — which is the
  # difference between knowing the runner reported "Timed out while requesting screenshot" and being
  # able to read the state around it. Every bundle is kept: the variable is this lane asking for them.
  #
  # BAJUTSU_STALL_DIAGNOSTICS arms the in-process capture (BE-0361 unit 2) that fires the moment the
  # channel declares a mid-run crash or `recordVideo` produces no bytes — the two moments when the
  # state separating "the render service wedged" from "the host starved the Simulator" still exists.
  # Bounded on the Python side (a per-capture wall-clock budget, a per-run capture cap), so a
  # crash-looping job cannot spend its `timeout-minutes` here.
  BAJUTSU_XCUITEST_RESULT_BUNDLES: ${{ github.workspace }}/runs/runner-logs
  BAJUTSU_STALL_DIAGNOSTICS: ${{ github.workspace }}/runs/diagnostics/stalls
  BAJUTSU_XCUITEST_STARTUP_TIMEOUT: "300"
  # A *respawn* readiness ceiling, tighter than the 300s cold-start one above
  # (bajutsu/platform_lifecycle/environments/xcuitest.py, _respawn_timeout). The 300s ceiling exists
  # for the first bring-up — first Simulator boot + app install + the initial `xcodebuild
  # test-without-building` host spin-up. A mid-run respawn (a crash evicted the warm resident) re-spawns
  # on an already-booted Simulator with the app installed, so it does not need that budget; waiting the
  # full 300s again only lets a dead runner hang for minutes inside a single respawn — which the
  # scenario-level BAJUTSU_CRASH_RECOVERY_BUDGET cannot cut short, because that budget is checked only
  # *between* attempts, never mid-readiness. 90s is ample for a re-spawn to answer /health on a warm
  # host, so a runner that will not come back fails loudly in ~90s instead of ~300s. Unset (elsewhere)
  # keeps the cold ceiling for respawns too, so only this lane opts in.
  BAJUTSU_XCUITEST_RESPAWN_TIMEOUT: "90"
  # How long the cold spawn may spend repairing the Simulator between its two attempts
  # (bajutsu/platform_lifecycle/environments/xcuitest.py, `_recovery_timeout`). The retry used to
  # re-spawn onto the very device that had just failed it, which is why an app-launch timeout took the
  # whole lane down: the device was degraded, not merely unlucky. The recovery reboots and re-prepares
  # it — or creates a replacement when CoreSimulator has stopped listing it at all — and only then is
  # the second attempt worth spawning, so it earns a fresh readiness ceiling rather than the remains of
  # the first attempt's. Both repairs that actually change the device earn the same fresh ceiling: a
  # *reboot* ends with the device booted and about to be reinstalled onto, and a *replacement* has never
  # run anything — either way the retry's `xcodebuild test-without-building` runs against a device in a
  # genuine first-boot state, so both take the full 300s regardless of the failing attempt's own ceiling
  # (a rebooted respawn does not keep this lane's tighter 90s; `_spawn_cold`'s own erase-path precedent
  # already gives a fresh-boot device the full cold ceiling, and a reboot leaves the device no less
  # fresh-booted than an erase does). 180s covers the slowest rung (creating a Simulator and waiting out
  # its first boot) — checked once the rung returns, not preemptively (a rung's `simctl` call carries no
  # subprocess-level timeout of its own, so a genuinely wedged CoreSimulator falls through to this lane's
  # own `timeout-minutes` instead). The bound stops at the repair itself: the re-prep that follows
  # (erase/locale-pin/install, `_finish_repair` in the same file) runs unbounded, matching the policy
  # the first cold bring-up already gets, so it is in neither the 180s above nor either readiness
  # ceiling below. Whether the re-prep pays a locale-pin reboot cycle follows the device's actual
  # system locale, not the cached `_pinned_locale` field — `_finish_repair`'s cold prep resets that
  # field on every rung, reboot or replacement alike, since it only gates warm-runner reuse; it is
  # `_pin_system_locale`'s own read of the device's global domain that decides. A *replacement*
  # device is newly created and inherits the host's own locale, which the read finds does not match
  # the configured one, so the write runs and pays a reboot cycle on top of the boot already waited
  # out, plus the install: roughly 100-150s more, going by the ~80s Simulator boot the `golden` job
  # below prices. A *reboot*'s device is the very one from the original cold bring-up, whose earlier
  # write survives the reboot, so the read finds it already correct and the re-prep skips the cycle,
  # leaving only the reinstall. Keeping the worst
  # case bounded when every rung does return in time: 300s + 180s + 300s ≈ 13min (plus the unbounded
  # re-prep above, so ~15min) for a failing *first* bring-up, and 90s + 180s + 300s ≈ 9.5min for a
  # failing respawn, whichever rung repairs it (a rebooted respawn's re-prep only reinstalls — small
  # enough to leave uncounted — while a respawn whose device had vanished pays the same locale-pin-plus-
  # install cost as the first-bring-up case above, so ~11-12min there). Only a *failing* spawn pays
  # recovery at all.
  #
  # A caveat the arithmetic above does not cover on its own: this recovery happens inside one lease's
  # bring-up, so BAJUTSU_CRASH_RECOVERY_BUDGET (below) cannot cut it short, and a job whose scenarios
  # are *also* burning that scenario-level budget can add both. A run on 2026-08-04 hit
  # `timeout-minutes` that way — three mid-run crashes plus one reboot rung — and a run on 2026-08-06
  # hit it again on the `actuation` job: a Simulator whose rendering wedged mid-run kept crashing and
  # respawning across several scenarios (each paying its own fresh BAJUTSU_CRASH_RECOVERY_BUDGET
  # against the same still-wedged device — a bare respawn never restarts the Simulator, only the
  # runner process on it) for the job's full 27 minutes before `timeout-minutes` cancelled it with no
  # diagnosable cause. BAJUTSU_RUN_CRASH_RECOVERY_BUDGET (below `BAJUTSU_CRASH_RECOVERY_BUDGET`) now
  # bounds that: it caps crash-recovery time across the *whole run*, not per scenario, so a run whose
  # device keeps degrading fails loudly well before `timeout-minutes` instead of being cancelled
  # silently. The arithmetic above was actually re-run only against the `run` and `actuation` jobs'
  # `timeout-minutes` comments below — `golden`, `bundled-runner`, `codegen`, `conformance`,
  # `fault-injection`, and `visual` still carry their original headroom claims, unrevisited.
  # `bundled-runner` is the one this file's per-job budgets do not fully cover on their own: it runs
  # two separate `bajutsu run` invocations (SwiftUI, then UIKit), each with its own
  # BAJUTSU_RUN_CRASH_RECOVERY_BUDGET, so a single job can still pay two independent worst cases.
  BAJUTSU_XCUITEST_RECOVERY_TIMEOUT: "180"
  # How long `simctl io recordVideo` gets to write its first byte before the scenario gives up on
  # confirming when the recording actually began (bajutsu/evidence/intervals.py,
  # `_video_start_timeout`). The 5s compiled default is generous locally but not on a loaded macOS
  # runner, where a run on 2026-08-06 timed out and left one scenario's step/network timestamps
  # anchored to the moment its step loop began rather than to the video — the drift BE-0346 exists to
  # remove. Unlike the ceilings above, overshooting costs nothing on the healthy path: the poll
  # returns the instant the first byte lands, so this only raises the ceiling for the slow case.
  BAJUTSU_VIDEO_START_TIMEOUT: "20"
  # Respawn the resident runner cold after a single warm reuse rather than the default 3
  # (`_MAX_WARM_REUSES`). Folding many scenarios into one `bajutsu run` (the `run` / `actuation` jobs)
  # lengthens each warm-runner session, and each warm reuse re-attaches the XCTest automation session
  # to a freshly launched app — a session that can destabilize into a mid-run crash after enough
  # cycles on a contended CI host (see `_MAX_WARM_REUSES` in
  # bajutsu/platform_lifecycle/environments/xcuitest.py). Respawning sooner caps that accumulation:
  # the fourteen-scenario `run` job pays seven cold startups instead of one — three more than the four
  # pre-consolidation jobs summed to — but the build-once `build` job already removed their per-job
  # Swift builds, so the lane's net cost still drops even though this cap gives back those extra
  # cold startups. The run pipeline's scenario-level crash recovery (BackendCrashError retry) is the
  # primary defense; this cap is a complementary reduction, kept because a smaller warm-runner
  # session is simply steadier.
  BAJUTSU_XCUITEST_MAX_WARM_REUSES: "1"
  # Raise the scenario-level backend-crash retry budget from the default 1 for the metered on-device
  # lane (`_default_crash_retries`, bajutsu/runner/pipeline.py). The resident XCTest host still crashes
  # more here than on a real Mac even with the runner's re-entrancy serialization (Router.actuationLock)
  # removing the concurrent-snapshot abort; 2 (three attempts) rides out the residual one-off crash so a
  # single unlucky scenario does not redden the fourteen-scenario `run` job. A crash on *every* attempt still
  # fails loudly once the budget is spent (BE-0049) — this only absorbs a genuine one-off, never a
  # reproducible failure. The pytest-driven `conformance` job consumes these two knobs too (BE-0334):
  # it does not run through the pipeline, but its crash-recovery plugin reads the same
  # `_default_crash_retries` / `_default_crash_recovery_budget`, so both lanes share one retry budget
  # from here rather than pinning their own and drifting apart.
  BAJUTSU_CRASH_RETRIES: "2"
  # Cap the *wall-clock* the scenario-level crash recovery may spend respawning, on top of the count
  # above (bajutsu/runner/pipeline.py, _default_crash_recovery_budget). The count alone is unbounded in
  # time: a runner that crashes and never comes back keeps respawning, and each respawn runs simctl prep
  # and re-runs the scenario. BAJUTSU_XCUITEST_RESPAWN_TIMEOUT (90s, above) caps a *bare* in-place
  # respawn's readiness wait, but a crash-triggered retry (attempt > 1) now forces the same `erase`
  # precondition a scenario already gets from `erase: true` (bajutsu/runner/pipeline.py's forced-erase
  # retry) unless the scenario opts out or the route rejects `erase` outright — and `erase` is exactly
  # what makes `is_respawn` false (bajutsu/platform_lifecycle/environments/xcuitest.py:661), so that
  # attempt pays the *full* 300s STARTUP_TIMEOUT ceiling plus the unbounded erase/boot/install prep
  # (~80-150s going by the `golden` job's own ~80s Simulator-boot estimate below), not the tight 90s one.
  # Worst case per erase-carrying attempt is therefore ≈450s (150s prep + the full 300s ceiling), not
  # the ≈90s a bare respawn costs. This budget is what still bounds a scenario to roughly one such
  # attempt rather than the full BAJUTSU_CRASH_RETRIES=2: the deadline is set at the *first* crash (not
  # erase-carrying) and checked only between attempts, so a second, erase-carrying attempt that also
  # crashes lands at ≈450s elapsed — already past this 300s deadline — and the third attempt is never
  # tried. 300s keeps a never-recovering runner failing loudly in ≈450s wall-clock, well under the 60min
  # `timeout-minutes`, while still riding out a genuine one-off (the first respawn is never blocked) — a
  # backstop on top of the per-respawn ceiling, not a substitute for it.
  BAJUTSU_CRASH_RECOVERY_BUDGET: "300"
  # The run-level counterpart to BAJUTSU_CRASH_RECOVERY_BUDGET (bajutsu/runner/pipeline.py,
  # _default_run_crash_recovery_budget): a wall-clock cap on crash recovery across the *whole* run,
  # not reset per scenario — but sized against a *single* scenario's own worst case above (≈450s), not
  # the ≈90s a bare-respawn-only design would cost. 900s (15min) clears that single-scenario worst case
  # with real margin, so this cap functions as a genuine multi-scenario backstop (a systemically
  # degrading device across several scenarios) rather than a tighter version of the per-scenario budget
  # that could trip on one scenario's own legitimate retry. The 900s is not a hard stop, though: a
  # scenario's recovery time is billed only once its own retry loop ends, and `exhausted()` is read
  # at crash time, so a scenario that starts recovering while the total still reads 899s is never
  # refused — it pays its full ≈450s worst case above, and only the *next* scenario is cut off.
  # Worst case billed is therefore ≈1350s, which leaves ≈2250s of headroom under the smallest
  # `timeout-minutes` below (60min = 3600s, raised from 25min) for the nine scenarios' nominal work
  # (seconds each, not minutes, when nothing crashes) and the artifact upload once recovery gives up —
  # see the caveat above BAJUTSU_XCUITEST_RECOVERY_TIMEOUT for the incident this closes and the
  # `bundled-runner` job it does not fully cover (two `bajutsu run` invocations, each billed this budget
  # independently). This budget also bounds *retry* time only, not the run: `exhausted()` is read
  # inside `except BackendCrashError`, i.e. after a scenario has already leased and crashed once, so a
  # scenario is never refused its *first* attempt once the run-level budget is spent — every remaining
  # scenario still pays one cold-spawn attempt against a still-wedged device before failing loudly on
  # this budget. That is a deliberate trade-off, not an oversight: latching "the run budget is spent" to
  # skip leasing entirely for every later scenario would also abandon a device that happens to have
  # recovered on its own after the erase-carrying retry that spent the budget. With this budget spent,
  # the job's worst case is therefore ≈900s (the budget) plus one cold-spawn ceiling per remaining
  # scenario, not a single clean cutoff at 900s.
  BAJUTSU_RUN_CRASH_RECOVERY_BUDGET: "900"

jobs:
  # Decide whether an on-device run is warranted. The macOS jobs only fire when the PR
  # touches what they exercise — the app, the SDK, the runtime, the build/deps, or this
  # workflow/action itself. Manual runs (no PR context) always count as relevant. The same
  # decision also gates the `visual` job below (BAJUTSU broader relevance list is a superset of
  # its former standalone path filter, so it never runs less often than before).
  #
  # The decision lives in scripts/e2e_changes.py (the positive-list of on-device-relevant paths,
  # and the merge-base diff that scopes the check to the PR's own changes) so it is unit-tested —
  # tests/test_e2e_changes.py — rather than an untested shell one-liner. Add a new
  # on-device-relevant path to the positive-list there.
  changes:
    name: detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      # BE-0322: `shared` is a shared-code change (fire the whole lane); `affected` is the JSON array
      # of scenario-keyed jobs a scenario-only change reached. A scenario-keyed job runs when
      # `relevant` and (`shared` or the job is in `affected`); a dimension job runs on any `relevant`.
      shared: ${{ steps.filter.outputs.shared }}
      affected: ${{ steps.filter.outputs.affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so the script's merge-base (three-dot) diff can find the PR's fork point.
          fetch-depth: 0
      - name: Detect relevant paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: python3 scripts/e2e_changes.py

  # Build once, fan out. Compile the two showcase apps (SwiftUI + UIKit) and the resident XCUITest
  # runner, and stage the bundled runner — every host-independent product the consumer jobs install —
  # then tar them into one artifact each consumer downloads. Building here rather than in every
  # consumer trades their cold Swift builds on 10x-billed macOS runners for one, and rolls the
  # cold-build flake dice once instead of once per job. A `tar` (not upload-artifact's per-file
  # upload) preserves the .app bundles' executable bits and symlinks; the runner's .xctestrun uses
  # __TESTROOT__-relative references (demos/showcase/Makefile) and every macOS runner unpacks to the
  # identical GITHUB_WORKSPACE path, so the products relocate cleanly across jobs. `codegen` and
  # `visual` are not consumers — they compile a different product (the UITests scheme / a
  # `make e2e-visual` rebuild) and stay self-contained.
  build:
    name: build (app + runner)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-latest
    # Cap the metered macOS job (10x billing): a hung xcodebuild would otherwise run to the 6h
    # default. A cold build of both apps + the runner is ~6min, so 60 catches a real hang with
    # comfortable headroom.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the iOS toolchain
        id: toolchain
        uses: ./.github/actions/setup-ios-toolchain
        with:
          # A build needs no Simulator; the consumer jobs boot their own. Skipping the boot frees
          # this job's CoreSimulator work.
          boot: "false"

      # Cache the showcase app's DerivedData so `swiftui-build` is incremental across runs. Keyed on
      # Xcode + the app's Swift sources + project spec; the `-app-` infix keeps this app-scheme cache
      # from colliding with the codegen job's UITests-scheme cache that writes the same DerivedData
      # path. restore-keys warm compiled modules on a partial source change; a miss just rebuilds
      # cold, so the cache only ever speeds the build, never its result.
      - name: Cache DerivedData (app)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: demos/showcase/ios/swiftui/build/dd
          key: xcode-dd-app-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode-version }}-${{ hashFiles('BajutsuKit/**/*.swift', 'demos/showcase/ios/swiftui/**/*.swift', 'demos/showcase/ios/swiftui/**/project.yml') }}
          restore-keys: |
            xcode-dd-app-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode-version }}-

      # The resident XCUITest runner builds into its own DerivedData dir; cache it separately so
      # `runner-build` is incremental too. The key covers the runner's Swift sources and project
      # spec, plus two inputs that are not Swift and so would otherwise restore a stale build:
      # Package.resolved (the resolved dependency versions, which now include Hummingbird and
      # SwiftNIO) and openapi.yaml with its generator config (the build-tool plugin's input, from
      # which the server types are generated). Package.swift needs no separate entry — the
      # BajutsuKit/**/*.swift glob already covers the manifest.
      - name: Cache DerivedData (runner)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: BajutsuKit/Runner/build/dd
          key: xcode-dd-runner-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode-version }}-${{ hashFiles('BajutsuKit/**/*.swift', 'BajutsuKit/Runner/project.yml', 'BajutsuKit/Package.resolved', 'BajutsuKit/Sources/BajutsuRunner/openapi.yaml', 'BajutsuKit/Sources/BajutsuRunner/openapi-generator-config.yaml') }}
          restore-keys: |
            xcode-dd-runner-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode-version }}-

      # The UIKit twin builds into its own DerivedData dir; cache it separately (keyed on the UIKit
      # app's Swift sources + project spec). Only the bundled-runner job installs it, but building it
      # here keeps the fan-out artifact complete.
      - name: Cache DerivedData (uikit)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: demos/showcase/ios/uikit/build/dd
          key: xcode-dd-uikit-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode-version }}-${{ hashFiles('BajutsuKit/**/*.swift', 'demos/showcase/ios/uikit/**/*.swift', 'demos/showcase/ios/uikit/**/project.yml') }}
          restore-keys: |
            xcode-dd-uikit-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode-version }}-

      # Build both a11y apps and the resident XCUITest runner. `make runner-bundle` (BE-0292) runs
      # its own `runner-build` (so the testRunner-config path is populated too) AND stages the runner
      # into bajutsu/_xcuitest_runner/ for the bundled-runner job — one command covers both runner
      # consumers.
      - name: Build the apps + runner
        run: |
          make -C demos/showcase swiftui-build
          make -C demos/showcase uikit-build
          make runner-bundle

      # Tar the products so the .app bundles keep their executable bits + symlinks (upload-artifact
      # uploads files individually and would flatten both). The whole runner Products dir travels
      # together so the .xctestrun's __TESTROOT__-relative bundle references resolve after untar.
      - name: Package the build products
        run: |
          tar -cf ios-build.tar \
            demos/showcase/ios/swiftui/build/dd/Build/Products/Debug-iphonesimulator/BajutsuShowcaseSwiftUI.app \
            demos/showcase/ios/uikit/build/dd/Build/Products/Debug-iphonesimulator/BajutsuShowcaseUIKit.app \
            BajutsuKit/Runner/build/dd/Build/Products \
            bajutsu/_xcuitest_runner

      - name: Upload the build products
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ios-build
          path: ios-build.tar
          # Throwaway per-run products; no reason to keep them beyond a day of debugging.
          retention-days: 1
          if-no-files-found: error

  # The homogeneous XCUITest gating lane: one boot, one resident runner drive every `bajutsu run`-
  # over-XCUITest scenario that used to be its own job (smoke / gestures / permission /
  # runner-actuation). They differed only in which scenarios they ran, so each re-paid the lane's
  # dominant fixed cost — the cold `xcodebuild test-without-building` XCTest-host startup (~2-3 min on
  # macos-latest) — over again, at 10x macOS billing. Folded into one `bajutsu run`, the fourteen scenario
  # documents that run — every scenario the eight files hold, since BE-0315 made the notification grant
  # native so nothing is `ai`-tagged to exclude — pay that cold
  # startup seven times (BE-0291's warm reuse carries the runner between them, capped at 1 on this lane
  # — see the env block above), three more than the four the separate jobs summed to — but those jobs
  # each also paid their own Swift build and boot, which the shared `build` job below now pays once
  # for the whole lane.
  # `run` runs each scenario to its own verdict and exits non-zero if any
  # fails, so the single job reddens the required `E2E` gate exactly as the four jobs did — the
  # per-scenario pass/fail moves from job names into the run's report. It installs the prebuilt
  # products from the `build` job (no build here). Kept separate (genuinely different execution
  # models): `codegen` (native xcodebuild on generated Swift), `conformance` (pytest ondevice),
  # `bundled-runner` (the bundled-runner config on two targets). The non-gating `actuation` / `golden`
  # / `visual` stay out (per-PR signals, deliberately off the gate).
  #   - smoke.yaml: the Stable catalog on the launch tab (wait/expect only).
  #   - gestures_multitouch.yaml (BE-0019): pinch/rotate through the runner's /gesture endpoint.
  #   - picker_wheel.yaml (BE-0356): `setPickerValue` through the runner's /setPickerValue endpoint,
  #     on a `UIPickerView` and on a wheel-mode `UIDatePicker`. Like alert.yaml below, it is here for
  #     coverage `swift test` cannot give: `Package.swift` declares no target over `Runner/Sources`,
  #     so `XcuitestElementProvider.setPickerValue` — the `adjust(toPickerWheelValue:)` call and its
  #     value read-back — has no off-device gate at all. The multi-component scenario is what proves
  #     the `within` / `traits` / `index` addressing separates two real sibling wheels.
  #   - search.yaml (BE-0281): /type into the Search field, then assert the filtered count.
  #   - notices.yaml (BE-0281): /swipe an off-screen row into view, then /back from a pushed detail.
  #   - alert.yaml: tap each button of a presented `UIAlertController` — the only scenario here that
  #     reaches `uniquelyIdentifiedElement`'s duplicate-group branch. `Package.swift` declares no
  #     target over `Runner/Sources`, so `swift test` compiles neither
  #     `recordedAttributes(of:includingValue:)` call site. Don't trim it without replacing that
  #     coverage (see the `scenarios:` note below).
  #   - permission.yaml (BE-0276): both scenarios run. `location` is pre-granted by `simctl privacy
  #     grant` (no prompt); the notification scenario grants reactively through `systemAlertHandling`, which
  #     since BE-0315 clears the SpringBoard prompt by a native accessibility query — no screenshot, no
  #     model, no API key — so it stays on this deterministic gate (prime directive 1 holds).
  #   - permission_system_alert.yaml (BE-0316): `handleSystemAlert` taps the SpringBoard prompt's
  #     "Allow" by a native query — the *proactive* native counterpart to permission.yaml's *reactive*
  #     native grant above.
  # The three permission scenarios run last so their OS-level grants never perturb the state-neutral
  # scenarios above them; each scenario relaunches the app under the warm runner, so their isolation
  # holds. No scenario is `ai`-tagged, so the lane runs every one with no `--exclude`.
  run:
    name: run (xcuitest)
    needs: [changes, build]
    # BE-0322: a scenario-keyed job runs on a shared-code change, or when a scenario it declares
    # changed. A scenario-only change to none of this job's scenarios narrows it out.
    if: >-
      needs.changes.outputs.relevant == 'true' &&
      (needs.changes.outputs.shared == 'true' ||
      contains(fromJSON(needs.changes.outputs.affected), 'run'))
    runs-on: macos-latest
    # Cap the metered macOS job (10x billing): a hung Simulator/runner would otherwise run to the 6h
    # default. No build here (the `build` job staged the products) — boot + install + one cold runner
    # + six short scenarios is ~15min, so 60 catches a real hang with headroom. A mid-run backend crash
    # adds at most about one more cold respawn: BAJUTSU_CRASH_RECOVERY_BUDGET (300s, above) bounds the
    # scenario-level recovery in wall-clock, so a never-recovering runner fails loudly inside that
    # window rather than paying BAJUTSU_CRASH_RETRIES × the 300s startup ceiling and hanging to this cap.
    # A cold spawn that has to repair its device costs at most one recovery plus a second ceiling on top
    # of its own (BAJUTSU_XCUITEST_RECOVERY_TIMEOUT, above). The observed signature — an app-launch
    # timeout ending attempt 1 in ~40s, repaired by a reboot whose re-prep is cheap enough to leave
    # uncounted — costs ~40s + 180s + 300s ≈ 9min and fits; the worst case the arithmetic block allows
    # (a first bring-up that burns the full 300s, repaired by a replacement and its re-prep: ~15min)
    # puts this job at ~28min, which 60 clears with room to spare — the cap now backs a genuine hang
    # rather than bounding the recovery arithmetic itself.
    timeout-minutes: 60
    # BE-0231 unit 4: a cold-boot CI Simulator sometimes renders the first Stable row later than a
    # scenario's 10s first-wait allows — even with unit 2's `readyWhen` gate (which waits up to
    # _await_ready's own 10s for that row). Raise the wait *floor* so the condition wait has the
    # budget to see it: the gate's ~10s plus this 20s ceiling gives the row ~30s from launch, well
    # past the >20s cold-boot render observed on this lane. A condition wait returns the instant the
    # row appears, so a fast render is unaffected — no fixed sleep (prime directive 2), the same knob
    # the Android e2e lane opts into (demos/showcase/android/Makefile). Only a genuine no-show spends
    # the full budget, and it still fails loudly, bounded well under timeout-minutes above.
    env:
      BAJUTSU_MIN_WAIT_TIMEOUT: "20"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the iOS toolchain
        id: toolchain
        uses: ./.github/actions/setup-ios-toolchain

      # Install the prebuilt products from the `build` job instead of compiling here. `tar -xpf`
      # restores the .app bundles' executable bits + symlinks and the runner Products dir whole, so
      # the .xctestrun's __TESTROOT__-relative references resolve (see the build job's header).
      - name: Download the prebuilt app + runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ios-build

      - name: Unpack the build products
        run: tar -xpf ios-build.tar

      - name: Wait for the Simulator
        run: xcrun simctl bootstatus "${{ steps.toolchain.outputs.udid }}" -b

      - name: Install the app
        run: xcrun simctl install "${{ steps.toolchain.outputs.udid }}" "demos/showcase/ios/swiftui/build/dd/Build/Products/Debug-iphonesimulator/BajutsuShowcaseSwiftUI.app"

      # Every gating XCUITest scenario in one `bajutsu run`: seven cold runner startups (MAX_WARM_REUSES=1), warm-reused
      # across the fourteen scenario documents that run (every scenario the eight files below hold; nothing is
      # `ai`-tagged since BE-0315, so no `--exclude`). State-neutral scenarios first, the three
      # permission scenarios last (see the job header).
      # alert.yaml is here for the duplicate-node resolution wiring: `swift test` compiles no target over
      # `Runner/Sources`, so neither `recordedAttributes(of:includingValue:)` call site has an off-device
      # gate. `liveElement(for:)`'s is already exercised by every actuation this lane runs; the one only a
      # presented `UIAlertController` reaches is `uniquelyIdentifiedElement`'s, on a duplicate group. On a
      # Simulator older than iOS 26 the duplicate registration never appears, so a green lane proves the
      # sole-match path rather than the group rule — it gates the flat-query wiring either way.
      - name: Run the gating XCUITest scenarios (smoke, gestures, runner channel, permissions)
        uses: ./.github/actions/bajutsu-e2e
        with:
          scenarios: >-
            demos/showcase/scenarios/smoke.yaml
            demos/showcase/scenarios/gestures_multitouch.yaml
            demos/showcase/scenarios/picker_wheel.yaml
            demos/showcase/scenarios/search.yaml
            demos/showcase/scenarios/notices.yaml
            demos/showcase/scenarios/alert.yaml
            demos/showcase/scenarios/permission.yaml
            demos/showcase/scenarios/permission_system_alert.yaml
          target: showcase-swiftui
          backend: xcuitest
          config: demos/showcase/showcase.config.yaml
          udid: ${{ steps.toolchain.outputs.udid }}
          artifact-name: run

      # The onboarding gate for real (BE-0304): with the Simulator booted, assert `bajutsu doctor`'s
      # `environment:` section reports no ✗ — exercising simctl.py's real JSON parsing (`booted_udids`)
      # and preflight.py's real tool checks (`xcrun`, `xcodebuild`) through the real actuator, the
      # drift no injected-fake unit test can see. `--environment-only` stops doctor at the runnability
      # gate, so this pays nothing for the screen probe and never touches the resident runner (its
      # startup flakiness is the run scenarios' concern above, already passed by here). Runs after the
      # scenarios step because the bajutsu-e2e action is what syncs the venv (`uv sync --no-dev`); the
      # Simulator stays booted, so the gate sees the same real environment. A ✗ fails this gating job.
      - name: Onboarding gate (bajutsu doctor environment — BE-0304)
        env:
          UDID: ${{ steps.toolchain.outputs.udid }}
        run: >-
          uv run --no-sync python scripts/assert_doctor_env.py --expect ok
          --target showcase-swiftui --backend xcuitest
          --config demos/showcase/showcase.config.yaml --udid "$UDID"

  # The lane's non-gating landing pad: real on-device XCUITest behavior that has not yet earned a place
  # in the gating `run` job above — `back`, device control, and text editing that the `golden` /
  # `visual` jobs never reach (they only `wait` / `expect` / snapshot), plus the scenario-authoring
  # features BE-0285 brings to iOS. The gating `run` job already drives the proven `/back`, `/type`,
  # `/swipe`, and gesture scenarios; here newer behavior earns its stability first, before it is
  # promoted up into `run`:
  #   - navigation.yaml: tap a Stable row → push Horse Detail → `back` (the OS back button). `tap` is
  #     already the conformance job's contract, but `back` end-to-end through the resident runner is not.
  #   - extract.yaml / foreach.yaml / data_driven.yaml / relaunch.yaml (BE-0285): the scenario-authoring
  #     features, on the third actuating backend after adb and Playwright. `extract` and `forEach` are
  #     pure orchestrator logic over `query()` snapshots and are thoroughly unit-tested, but FakeDriver's
  #     screen is frozen, so what only a device shows is a tree that mutates *during* iteration —
  #     foreach.yaml pushes and pops a detail inside its loop body — and a value a real accessibility
  #     tree reports rather than one a test scripted, which extract.yaml captures off the Log tab's live
  #     counter. data_driven.yaml (three rows, each in its own clean environment) and relaunch.yaml were
  #     proven on adb and Playwright only, so running them here is what stops either feature from
  #     resting on one backend. All four are the shared showcase files, unchanged (BE-0221), and are
  #     listed ahead of device.yaml / push.yaml so neither a delivered notification nor an OS-level
  #     grant precedes a scenario that only reads and taps the app's own UI.
  #   - device.yaml / push.yaml: `setLocation`, clipboard round-trip, and a simctl `push` — the
  #     device-control family, the iOS twin of Android's device control (BE-0210). Both run on the
  #     launch tab.
  #   - text_editing.yaml: `select` + `copy` (⌘A / ⌘C), then `delete` and `clear` on the Search field,
  #     with the copied text read back through the `clipboard` assertion — the four text-editing
  #     actuators no other scenario drove. It crosses to the Search tab, so once stable it can move up
  #     into the `run` job beside search.yaml.
  #   - paste_system_alert.yaml (BE-0369): the lane's only genuine *cross-process* paste —
  #     `setClipboard` writes the pasteboard from outside the app, so the app's read raises iOS's
  #     paste-consent prompt, answered natively by `handleSystemAlert: { prompt: paste }` — granted
  #     and denied, each under the target's locale and again under `locale: ja_JP`. It lands
  #     here rather than beside permission_system_alert.yaml in `run` for this job's own reason: it
  #     is new on-device coverage, so it earns its stability as a per-PR signal first.
  # Deliberately NOT in the `E2E` gate's `needs:` below (like `golden` / `visual`): the Simulator lane
  # has a flakiness history (BE-0218), so new coverage lands as a per-PR signal first and is promoted
  # to the gate only once it proves stable. It installs the prebuilt products from the `build` job and
  # runs every scenario in one `bajutsu run` (cost discipline: the macOS runner bills at 10x), so the
  # job's dominant cost — the cold XCTest-host startup — is paid once per two scenario runs rather than
  # once per run. Folding BE-0285's four files in here rather than into a job of their own follows
  # the same reasoning: a second non-gating job would differ only in which scenarios it ran, and would
  # re-pay this lane's boot, install, and cold startup to do it. Promote a scenario into `run` once it
  # is stable.
  actuation:
    name: actuation (xcuitest)
    needs: [changes, build]
    # BE-0322: runs on a shared-code change, or when one of its scenarios (navigation / extract /
    # foreach / data_driven / relaunch / device / push / text_editing / paste_system_alert) changed.
    if: >-
      needs.changes.outputs.relevant == 'true' &&
      (needs.changes.outputs.shared == 'true' ||
      contains(fromJSON(needs.changes.outputs.affected), 'actuation'))
    runs-on: macos-latest
    # Cap the metered macOS job (10x billing): a hung Simulator/runner would otherwise run to the 6h
    # default. Install (no build) + the fourteen scenario runs the nine files below produce (each file
    # holds one scenario; data_driven.yaml's three `${row.*}` rows expand to three, and
    # paste_system_alert.yaml holds four) is ~25min — the dominant term is seven cold XCTest-host
    # startups, one per two runs at this lane's warm-reuse cap — so 60 catches a real hang with
    # headroom rather than reddening a healthy run. Of those startups only the first carries the 300s
    # cold ceiling (the rest take the 90s respawn one), and one pays a shutdown-and-boot cycle on top:
    # the first of paste_system_alert.yaml's two Japanese scenarios re-pins the device's system
    # language, which only a reboot makes SpringBoard read (BE-0320). Only a *failing*
    # spawn adds a device recovery plus a second ceiling. The observed signature — an app-launch
    # timeout ending attempt 1 in ~40s, repaired by a reboot whose re-prep is cheap enough to leave
    # uncounted — costs ~40s + 180s + 300s ≈ 9min and fits; the worst case the arithmetic block allows
    # (a first bring-up that burns the full 300s, repaired by a replacement and its re-prep: ~15min)
    # puts this job at ~40min, which 60 also clears with room to spare — the cap now backs a genuine
    # hang rather than bounding the recovery arithmetic itself.
    timeout-minutes: 60
    # Raise the wait floor so a cold-boot Simulator has budget to render the first Stable row before
    # each scenario's own 10s first-wait — the same knob the `run` job above and the Android lane use.
    # A condition wait returns the instant the row appears, so this is a ceiling, not a sleep.
    env:
      BAJUTSU_MIN_WAIT_TIMEOUT: "20"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the iOS toolchain
        id: toolchain
        uses: ./.github/actions/setup-ios-toolchain

      # Install the prebuilt products from the `build` job instead of compiling here (see the build
      # job's header for the tar / __TESTROOT__ rationale).
      - name: Download the prebuilt app + runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ios-build

      - name: Unpack the build products
        run: tar -xpf ios-build.tar

      - name: Wait for the Simulator
        run: xcrun simctl bootstatus "${{ steps.toolchain.outputs.udid }}" -b

      - name: Install the app
        run: xcrun simctl install "${{ steps.toolchain.outputs.udid }}" "demos/showcase/ios/swiftui/build/dd/Build/Products/Debug-iphonesimulator/BajutsuShowcaseSwiftUI.app"

      # Every scenario in one `bajutsu run` so they share a warm runner: the cold XCTest-host startup —
      # the job's dominant cost — is paid once per two scenario runs (BE-0291's warm reuse spans
      # leases within one process, capped at 1 on this lane — see the env block) instead of once per
      # run. This also removes the reason the steps were split: `run` runs every
      # scenario to its own per-scenario verdict regardless of the others failing, then exits non-zero
      # if any failed — the exact "run them all independently, redden if any fails" behavior the
      # continue-on-error steps plus the aggregator hand-rolled, now native to the run loop.
      #   - navigation.yaml (BE-0281): `tap` + `back` end-to-end, on the Stable launch tab.
      #   - extract.yaml (BE-0285): capture the Log tab's live counter with `extract` and feed the
      #     captured value into a later assertion — a value the real accessibility tree reported.
      #   - foreach.yaml (BE-0285): iterate the five Stable rows, pushing and popping a detail inside the
      #     loop body so the element tree mutates between iterations, then assert all five survived.
      #   - data_driven.yaml (BE-0285): three `${row.*}` rows, each in its own clean environment.
      #   - relaunch.yaml (BE-0285): flip an in-app control, `relaunch`, and assert the state reset.
      #   - device.yaml (BE-0281): `setLocation` + clipboard round-trip (simctl-backed, launch tab) —
      #     the iOS twin of android-e2e.yml's device-control coverage (BE-0210).
      #   - push.yaml (BE-0281): a simctl `push` delivery — iOS-only (no faithful Android-emulator
      #     equivalent, so it lives apart from the cross-backend device.yaml).
      #   - text_editing.yaml (iOS-only): `select` + `copy` round-trip the Search field's text, then
      #     `delete` + `clear` — the four editing actuators no other scenario drove (Search tab).
      #   - paste_system_alert.yaml (BE-0369): `setClipboard` seeds the pasteboard from outside the
      #     app, so the app's own read raises iOS's cross-process paste-consent prompt, which
      #     `handleSystemAlert: { prompt: paste }` answers by a native query. Four scenarios: `grant`
      #     and `deny` under the target's locale, then the same pair under `locale: ja_JP`, which is
      #     what proves the lookup against a SpringBoard rendering a language the run is not written
      #     in. Listed last, after the other device-control scenarios, because it leaves the
      #     pasteboard holding its own string — and because its Japanese pair leaves the device pinned
      #     to another system language, which only a cold respawn and a reboot change back (BE-0320).
      #     The gating `run` job does not name it: BE-0218's rule is that new on-device coverage
      #     earns its stability here first, and this is the lane's first cross-process paste.
      # The listed order is deliberate — see the job header for why BE-0285's four come first.
      - name: Run the actuation + authoring scenarios (xcuitest)
        uses: ./.github/actions/bajutsu-e2e
        with:
          scenarios: >-
            demos/showcase/scenarios/navigation.yaml
            demos/showcase/scenarios/extract.yaml
            demos/showcase/scenarios/foreach.yaml
            demos/showcase/scenarios/data_driven.yaml
            demos/showcase/scenarios/relaunch.yaml
            demos/showcase/scenarios/device.yaml
            demos/showcase/scenarios/push.yaml
            demos/showcase/scenarios/text_editing.yaml
            demos/showcase/scenarios/paste_system_alert.yaml
          target: showcase-swiftui
          backend: xcuitest
          config: demos/showcase/showcase.config.yaml
          udid: ${{ steps.toolchain.outputs.udid }}
          artifact-name: actuation-run

  # The BE-0006 element-tree golden over XCUITest: pins the normalized accessibility tree for the
  # Stable catalog's list rows, reached on the launch tab. Runs golden.yaml per PR — the iOS twin of
  # android-e2e.yml's `golden (adb)` job. Deliberately NOT in the `e2e` gate's `needs:` (like
  # `visual`): the tree golden is deterministic and host-independent, so a golden drift surfaces
  # here as a per-PR signal without blocking merges.
  golden:
    name: golden (xcuitest)
    needs: [changes, build]
    # BE-0322: runs on a shared-code change, or when golden.yaml changed.
    if: >-
      needs.changes.outputs.relevant == 'true' &&
      (needs.changes.outputs.shared == 'true' ||
      contains(fromJSON(needs.changes.outputs.affected), 'golden'))
    runs-on: macos-latest
    # Install the prebuilt products (no build) + a fresh Simulator boot (~80s) + the golden run is
    # well under this; 60 catches a hung Simulator/runner on the metered macOS runner with headroom.
    timeout-minutes: 60
    # Raise the wait floor so a cold-boot Simulator has budget to render the first Stable row before
    # the scenario's own 10s first-wait — the same knob the `run` job above and the Android lane use.
    # A condition wait returns the instant the row appears, so this is a ceiling, not a fixed sleep.
    env:
      BAJUTSU_MIN_WAIT_TIMEOUT: "20"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the iOS toolchain
        id: toolchain
        uses: ./.github/actions/setup-ios-toolchain

      # Install the prebuilt products from the `build` job instead of compiling here (see the build
      # job's header for the tar / __TESTROOT__ rationale).
      - name: Download the prebuilt app + runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ios-build

      - name: Unpack the build products
        run: tar -xpf ios-build.tar

      - name: Wait for the Simulator
        run: xcrun simctl bootstatus "${{ steps.toolchain.outputs.udid }}" -b

      - name: Install the app
        run: xcrun simctl install "${{ steps.toolchain.outputs.udid }}" "demos/showcase/ios/swiftui/build/dd/Build/Products/Debug-iphonesimulator/BajutsuShowcaseSwiftUI.app"

      # Runs golden.yaml over XCUITest; the scenario compares against its goldens/ baseline, a
      # field-level tolerant compare (bajutsu/golden.py) that is ABI-stable. golden_xcuitest.yaml
      # rides the same warm runner (the action passes each file as its own `--scenario`): it pins
      # the Log tab's Entry controls, and its second scenario is the accessibility-invariance check
      # for `run --touch-markers` — the same controls.json asserted with the in-app touch markers
      # on, so a visualization that perturbed the pinned controls fails here.
      - name: Run golden scenarios (BE-0006)
        uses: ./.github/actions/bajutsu-e2e
        with:
          scenarios: >-
            demos/showcase/scenarios/golden/golden.yaml
            demos/showcase/scenarios/golden/golden_xcuitest.yaml
          target: showcase-swiftui
          backend: xcuitest
          config: demos/showcase/showcase.config.yaml
          udid: ${{ steps.toolchain.outputs.udid }}
          artifact-name: ios-golden-run

  # The codegen output path: a scenario -> native XCUITest, compiled and run by xcodebuild
  # with no bajutsu / AI at test time. This is the claim M3 makes about codegen, so CI
  # has to exercise the generated Swift natively (not just the XCUITest runtime the other jobs
  # use). It runs against the SwiftUI a11y app, whose identifiers the generated test queries by name.
  codegen:
    name: codegen (xcuitest)
    needs: changes
    # BE-0338: runs on a shared-code change, or when one of the scenarios it codegens changed. Those
    # scenarios (components.yaml + the four coverage scenarios) are declared in demos/showcase/Makefile's
    # `ui-test` / `ui-test-coverage` targets, which scripts/e2e_changes.py folds into `affected`.
    if: >-
      needs.changes.outputs.relevant == 'true' &&
      (needs.changes.outputs.shared == 'true' ||
      contains(fromJSON(needs.changes.outputs.affected), 'codegen'))
    runs-on: macos-latest
    # Cap the metered macOS job (10x billing): a hung Simulator/xcodebuild would otherwise run to
    # the 6h default. Typical end-to-end is ~10min, so 60 catches a real hang with comfortable headroom.
    timeout-minutes: 60
    # `make ui-test` runs `uv run bajutsu codegen`, whose auto-sync would otherwise pull the dev
    # group (mypy / pytest / ruff + the gate-only extras). Codegen needs only the base package, so
    # skip dev for every uv invocation in this job — the Linux `check` gate owns that tooling.
    env:
      UV_NO_DEV: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the iOS toolchain
        id: toolchain
        uses: ./.github/actions/setup-ios-toolchain

      # Cache xcodebuild DerivedData so the UITest build is incremental across runs. Keyed on the
      # Xcode version + Swift sources + project spec; the restore-keys fallback warms the cache
      # (compiled modules) when only sources change, scoped to the same Xcode, and a miss simply
      # rebuilds cold — so the cache only ever speeds the build, never changes its result. No
      # `-app-` infix (unlike the `build` job's `-app-` cache): this job builds the UITests scheme
      # into the same DerivedData path, so its cache must never collide with that one.
      - name: Cache DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: demos/showcase/ios/swiftui/build/dd
          key: xcode-dd-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode-version }}-${{ hashFiles('BajutsuKit/**/*.swift', 'demos/showcase/ios/swiftui/**/*.swift', 'demos/showcase/ios/swiftui/**/project.yml') }}
          restore-keys: |
            xcode-dd-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode-version }}-

      # `make -C demos/showcase ui-test` re-generates ComponentsUITests.swift from the scenario,
      # regenerates the project, then `xcodebuild test`s it against the SwiftUI a11y app — no
      # bajutsu / AI at test time. No explicit "Wait for the Simulator" step (unlike the jobs that
      # install/actuate directly and follow the toolchain action's `udid` note): `xcodebuild test`
      # blocks on the destination becoming ready when it reaches the test phase, by which point the
      # boot the toolchain action started has finished.
      - name: Codegen + run native XCUITest
        run: make -C demos/showcase ui-test SIM=${{ steps.toolchain.outputs.udid }}

      # BE-0297 Unit 1/2/4: compile-and-run the DSL constructs components.yaml never reaches
      # (text-editing / gestures / multi-touch / coordinate-swipe / drag / compound selectors),
      # reusing scenarios already proven on-device by `bajutsu run` so only the emitted Swift is
      # newly under test. This slice is gating (BE-0297 Unit 4): it ran green as a non-gating signal
      # first (continue-on-error), and now folds into the job's `E2E`-gate verdict alongside the
      # Components step above. The DerivedData cache makes this second build incremental over it.
      - name: Codegen coverage — extended DSL surface
        run: make -C demos/showcase ui-test-coverage SIM=${{ steps.toolchain.outputs.udid }}

      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: xcuitest-result
          path: demos/showcase/ios/swiftui/build/dd/Logs/Test/*.xcresult
          if-no-files-found: ignore

  # The bundled-runner path (BE-0292): the same resident runner, but resolved from the wheel
  # bundle instead of a config `testRunner`. Uses showcase.bundled-runner.config.yaml, whose
  # targets carry no `xcuitest` block, so with the runner staged into bajutsu/_xcuitest_runner/ by
  # the `build` job's `make runner-bundle` (and carried in the shared artifact this job unpacks),
  # resolution falls through to the bundled runner and materializes it into the cache — proving a
  # Simulator run needs no runner-build and no runner path. smoke.yaml runs identically on every
  # target (it only asserts the fixed Stable catalog), so it is the steadiest proof; running it on
  # both toolkits shows the one app-agnostic bundled runner (BE-0019) drives SwiftUI and UIKit alike.
  # Forced onto XCUITest since the bundled runner is the point. Feeds the required `E2E` gate directly
  # (no continue-on-error), like `run` above.
  bundled-runner:
    name: bundled-runner (xcuitest)
    needs: [changes, build]
    # BE-0322: runs on a shared-code change, or when smoke.yaml changed (declared here and by `run`,
    # so a smoke.yaml edit fires both).
    if: >-
      needs.changes.outputs.relevant == 'true' &&
      (needs.changes.outputs.shared == 'true' ||
      contains(fromJSON(needs.changes.outputs.affected), 'bundled-runner'))
    runs-on: macos-latest
    # Cap the metered macOS job (10x billing): a hung Simulator/runner would otherwise run to the
    # 6h default. Install both prebuilt apps (no build) + two smoke runs is ~10min, so 60 catches a
    # real hang with headroom.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the iOS toolchain
        id: toolchain
        uses: ./.github/actions/setup-ios-toolchain

      # Install the prebuilt products from the `build` job instead of compiling here. The artifact
      # carries both apps (SwiftUI + UIKit) and the staged bundled runner (bajutsu/_xcuitest_runner),
      # so the two smoke runs below resolve to the staged copy with no testRunner path (BE-0292) — see
      # the build job's header for the tar / __TESTROOT__ rationale.
      - name: Download the prebuilt apps + bundled runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ios-build

      - name: Unpack the build products
        run: tar -xpf ios-build.tar

      - name: Wait for the Simulator
        run: xcrun simctl bootstatus "${{ steps.toolchain.outputs.udid }}" -b

      - name: Install the apps
        run: |
          xcrun simctl install "${{ steps.toolchain.outputs.udid }}" "demos/showcase/ios/swiftui/build/dd/Build/Products/Debug-iphonesimulator/BajutsuShowcaseSwiftUI.app"
          xcrun simctl install "${{ steps.toolchain.outputs.udid }}" "demos/showcase/ios/uikit/build/dd/Build/Products/Debug-iphonesimulator/BajutsuShowcaseUIKit.app"

      - name: Run smoke on the bundled runner (xcuitest — SwiftUI, no testRunner)
        uses: ./.github/actions/bajutsu-e2e
        with:
          scenarios: demos/showcase/scenarios/smoke.yaml
          target: showcase-swiftui
          backend: xcuitest
          config: demos/showcase/showcase.bundled-runner.config.yaml
          udid: ${{ steps.toolchain.outputs.udid }}
          artifact-name: bundled-runner-swiftui-run

      - name: Run smoke on the bundled runner (xcuitest — UIKit, no testRunner)
        uses: ./.github/actions/bajutsu-e2e
        with:
          scenarios: demos/showcase/scenarios/smoke.yaml
          target: showcase-uikit
          backend: xcuitest
          config: demos/showcase/showcase.bundled-runner.config.yaml
          udid: ${{ steps.toolchain.outputs.udid }}
          artifact-name: bundled-runner-uikit-run

  # The driver conformance suite (BE-0114): one backend-agnostic contract, run on-device against
  # the XCUITest backend (the resident BajutsuRunner). It proves the determinism-core invariants
  # (ambiguous selector fails, zero-match fails, capabilities() matches behavior, condition-backed
  # waits) hold on the real actuator, not just FakeDriver (fast gate) and Playwright (web CI).
  # `launch_driver` brings the backend up itself, so this job only needs the app + runner built and
  # a booted Simulator; the `ondevice` pytest marker (deselected by the gate's default) means the
  # same contract file runs here unchanged.
  conformance:
    name: conformance (xcuitest)
    needs: [changes, build]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-latest
    # Cap the metered macOS job (10x billing): a hung Simulator/runner would otherwise run to the
    # 6h default. Two backends end-to-end is ~12min, so 60 catches a real hang with headroom.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the iOS toolchain
        id: toolchain
        uses: ./.github/actions/setup-ios-toolchain

      # Install the prebuilt products from the `build` job instead of compiling here (see the build
      # job's header for the tar / __TESTROOT__ rationale).
      - name: Download the prebuilt app + runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ios-build

      - name: Unpack the build products
        run: tar -xpf ios-build.tar

      # Unlike the run/actuation/golden consumers (which install via the bajutsu-e2e action's
      # `uv sync --no-dev`), this job runs the suite through pytest, so it syncs the venv with the dev
      # group (pytest) here — the runner already came prebuilt, so there is no build to overlap.
      - name: Sync the venv (dev group, for pytest)
        run: uv sync

      - name: Wait for the Simulator
        run: xcrun simctl bootstatus "${{ steps.toolchain.outputs.udid }}" -b

      # This lane drives pytest, not the bajutsu-e2e action, so it wires the BE-0361 diagnostics
      # itself: `start` right after the device is up, `collect` below with `if: always()`.
      - name: Start iOS diagnostics
        # An observer may never decide this job: the step's own shell disables errexit and exits 0, and
        # this is the outer net for anything that gets past it (BE-0361). A lane that reddens because
        # its *diagnostics* fell over reports nothing about the software under test.
        continue-on-error: true
        uses: ./.github/actions/collect-ios-diagnostics
        with:
          phase: start
          udid: ${{ steps.toolchain.outputs.udid }}

      # `launch_driver` erases/installs/launches the backend, so no explicit install here. `-m
      # ondevice` overrides the repo default (`-m 'not web and not ondevice'`) to select exactly the
      # on-device suite; BAJUTSU_CONFORMANCE_UDID both routes the backend and un-skips the module.
      # `-n0` overrides the default `-n auto`: the suite reseeds one shared Simulator via a single
      # spec file the app polls, so parallel workers would clobber each other's screen — run serially.
      - name: Run the conformance suite (xcuitest)
        id: suite
        env:
          BAJUTSU_CONFORMANCE_UDID: ${{ steps.toolchain.outputs.udid }}
          # Recover a Simulator infrastructure fault the way `bajutsu run` does (BE-0334): a runner
          # crash re-leases a fresh device and re-runs the affected test, bounded per test by the retry
          # count and the wall-clock respawn budget. Those two knobs (BAJUTSU_CRASH_RETRIES /
          # BAJUTSU_CRASH_RECOVERY_BUDGET) are inherited from the workflow-level env, not re-pinned here,
          # so this lane cannot silently drift from the `run` lane's budget. A crash every attempt still
          # fails loudly (BE-0049); the 60-min job timeout above is the outer backstop.
          # A wedged CoreSimulator is not a crash: it gets no respawn, and is named a host fault in
          # the log and the report instead, so a red check reads as the host's fault (BE-0378). A
          # stall the harness's own retry absorbs reddens nothing, so it is counted there too — the
          # leading indicator of the same host.
          # Count every respawn into an uploaded artifact, so a degrading lane shows as a rising count.
          BAJUTSU_BACKEND_RECOVERY_REPORT: conformance-recovery.json
        run: uv run pytest tests/test_driver_conformance_ondevice.py -m ondevice -n0 -v

      - name: Collect iOS diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/collect-ios-diagnostics
        with:
          phase: collect
          udid: ${{ steps.toolchain.outputs.udid }}
          failed: ${{ steps.suite.outcome != 'success' }}

      # Upload the recovery report even when the suite fails, so an exhausted recovery is inspectable.
      - name: Upload the conformance recovery report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: conformance-recovery-report
          path: conformance-recovery.json
          if-no-files-found: ignore

      # The suite's own per-test video/deviceLog evidence (kept only on a failing test), the same
      # `runs/` path every scenario-driven job populates — this job had none before, unlike its adb
      # twin and the recovery report just above.
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ios-e2e-conformance-run
          path: runs/
          if-no-files-found: ignore

  # Fault injection for the runner channel's resilience layers (BE-0305). Every job above drives a
  # healthy runner, so BE-0207's transient retry and BE-0287's crash recovery — the two mechanisms that
  # exist for a runner that stops answering mid-run — are exercised only by a synthetic exception in the
  # fast suite. This job signals the real runner process instead: frozen briefly, its channel hangs the
  # way a wedged runner does and the retry absorbs it; frozen past the retry budget, crash recovery
  # waits it out and re-issues the read; killed outright, the run must stop on an honest crash diagnosis
  # rather than an unrelated timeout.
  #
  # A signal, not a gate: deliberately outside the `E2E` aggregate's `needs:` below. A lane that
  # deliberately breaks the runner carries more inherent flakiness risk than one driving a healthy one,
  # so it lands as a per-PR signal and is promoted only once stable — the same signal-then-required path
  # BE-0282's network lane took. It also never marks `backend_crash_recovery`: that plugin re-leases and
  # re-runs a test whose backend crashed, and here the crash is the assertion.
  fault-injection:
    name: fault-injection (xcuitest)
    needs: [changes, build]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-latest
    # Two frozen cases spend the channel's own budgets (a read's 15s socket window, three of them before
    # a crash is declared) and the killed case polls out the 60s recovery window, so the cases total
    # ~2.5min on top of the cold lease; 60 caps the metered macOS job (10x billing) against a hang, like
    # the conformance job above.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the iOS toolchain
        id: toolchain
        uses: ./.github/actions/setup-ios-toolchain

      # Install the prebuilt products from the `build` job instead of compiling here (see the build
      # job's header for the tar / __TESTROOT__ rationale).
      - name: Download the prebuilt app + runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ios-build

      - name: Unpack the build products
        run: tar -xpf ios-build.tar

      # Drives pytest, not the run CLI (like `conformance` above), so it syncs the dev group.
      - name: Sync the venv (dev group, for pytest)
        run: uv sync

      - name: Wait for the Simulator
        run: xcrun simctl bootstatus "${{ steps.toolchain.outputs.udid }}" -b

      # As in `conformance` above: a pytest lane wires the BE-0361 diagnostics itself. This lane
      # breaks the runner deliberately, so its captures are the closest thing to a control group for
      # what a *genuine* stall's evidence should look like.
      - name: Start iOS diagnostics
        # An observer may never decide this job: the step's own shell disables errexit and exits 0, and
        # this is the outer net for anything that gets past it (BE-0361). A lane that reddens because
        # its *diagnostics* fell over reports nothing about the software under test.
        continue-on-error: true
        uses: ./.github/actions/collect-ios-diagnostics
        with:
          phase: start
          udid: ${{ steps.toolchain.outputs.udid }}

      # `launch_driver` erases/installs/launches the backend, so no explicit install here.
      # BAJUTSU_FAULT_INJECTION_UDID both routes the backend and un-skips the module; the cases find the
      # runner process to signal by that same UDID, so they can only ever reach this job's device. `-n0`
      # overrides the default `-n auto`: parallel workers would freeze each other's runner.
      #
      # The guard is the point of the step: the module skips itself when the variable is unset, and a
      # skipped pytest exits 0 — so an empty `udid` (which the boot step leaves behind whenever it did
      # not run) would turn this whole lane into a green check that injected no fault at all. Refuse to
      # run instead, since a lane reporting green having tested nothing is the one outcome worse than red.
      - name: Run the XCUITest fault injection (retry, crash recovery, killed runner)
        id: suite
        env:
          BAJUTSU_FAULT_INJECTION_UDID: ${{ steps.toolchain.outputs.udid }}
        run: |
          if [ -z "$BAJUTSU_FAULT_INJECTION_UDID" ]; then
            echo "::error::no Simulator UDID: the fault-injection module would skip and report green"
            exit 1
          fi
          uv run pytest tests/test_fault_injection_ondevice.py -m ondevice -n0 -v

      - name: Collect iOS diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/collect-ios-diagnostics
        with:
          phase: collect
          udid: ${{ steps.toolchain.outputs.udid }}
          failed: ${{ steps.suite.outcome != 'success' }}

      # The runner's own log (the workflow-level BAJUTSU_XCUITEST_RUNNER_LOG puts it under `runs/`) is
      # where a fault that did not land the way a case expected is diagnosable.
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ios-e2e-fault-injection-run
          path: runs/
          if-no-files-found: ignore

  # On-device iOS visual-regression (VRT): the iOS twin of android-e2e.yml's `e2e-visual`. Boots a
  # Simulator, builds the SwiftUI showcase, and runs the committed pixel VRT
  # (`make -C demos/showcase e2e-visual`) over the XCUITest backend, comparing the Stable catalog
  # against the committed baselines_ios/ baseline. Deterministic (a pixel compare, no LLM), so it
  # stays within the prime directives.
  #
  # Gated by the same `changes` job as the functional jobs above, but deliberately NOT part of the
  # `e2e` gate's `needs:` below: a pixel baseline is host-specific — the Simulator renderer varies
  # by Xcode / device / OS — so a drift should surface as a signal on its own job, not block PRs on
  # the required check. On a drift the captured screenshot is uploaded to re-record the baseline
  # from (see demos/showcase/scenarios/visual/baselines_ios/README.md), the same bootstrap the
  # Android baseline used.
  visual:
    name: visual (xcuitest)
    needs: changes
    # BE-0338: runs on a shared-code change, or when its pixel VRT scenario changed. That scenario
    # (visual/visual_ios.yaml) is declared in demos/showcase/Makefile's `e2e-visual` target, which
    # scripts/e2e_changes.py folds into `affected`.
    if: >-
      needs.changes.outputs.relevant == 'true' &&
      (needs.changes.outputs.shared == 'true' ||
      contains(fromJSON(needs.changes.outputs.affected), 'visual'))
    runs-on: macos-latest
    # A cold Xcode build (~2.5min) + a fresh Simulator boot (~80s) + the VRT run is well under this;
    # 60 catches a hung Simulator/runner on the metered macOS runner with comfortable headroom.
    timeout-minutes: 60
    # Raise the wait floor so a cold-boot Simulator has budget to render the first Stable row before
    # the scenario's own 10s first-wait — the same knob the `run` job above and the Android lane use.
    # A condition wait returns the instant the row appears, so this is a ceiling, not a fixed sleep.
    env:
      BAJUTSU_MIN_WAIT_TIMEOUT: "20"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the iOS toolchain
        id: toolchain
        uses: ./.github/actions/setup-ios-toolchain
        with:
          # Pin the exact model the committed baseline was recorded on (see baselines_ios/README.md),
          # the iOS twin of android-e2e.yml's `profile: pixel_6`. Unpinned, boot-simulator takes
          # whichever iPhone the runner's Xcode ships first — a resolution change would drift this
          # pixel VRT for reasons unrelated to any UI change. A model missing from the runner fails
          # loudly rather than silently drifting.
          device-type: iPhone 17

      # Cache the showcase app's DerivedData so `swiftui-build` is incremental across runs (matches
      # the `build` job's app cache). A miss just rebuilds cold, so the cache only ever speeds the build.
      - name: Cache DerivedData (app)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: demos/showcase/ios/swiftui/build/dd
          key: xcode-dd-app-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode-version }}-${{ hashFiles('BajutsuKit/**/*.swift', 'demos/showcase/ios/swiftui/**/*.swift', 'demos/showcase/ios/swiftui/**/project.yml') }}
          restore-keys: |
            xcode-dd-app-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode-version }}-

      # The resident XCUITest runner builds into its own DerivedData dir; cache it separately so
      # `runner-build` is incremental too. The key covers the runner's Swift sources and project
      # spec, plus two inputs that are not Swift and so would otherwise restore a stale build:
      # Package.resolved (the resolved dependency versions, which now include Hummingbird and
      # SwiftNIO) and openapi.yaml with its generator config (the build-tool plugin's input, from
      # which the server types are generated). Package.swift needs no separate entry — the
      # BajutsuKit/**/*.swift glob already covers the manifest.
      - name: Cache DerivedData (runner)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: BajutsuKit/Runner/build/dd
          key: xcode-dd-runner-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode-version }}-${{ hashFiles('BajutsuKit/**/*.swift', 'BajutsuKit/Runner/project.yml', 'BajutsuKit/Package.resolved', 'BajutsuKit/Sources/BajutsuRunner/openapi.yaml', 'BajutsuKit/Sources/BajutsuRunner/openapi-generator-config.yaml') }}
          restore-keys: |
            xcode-dd-runner-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode-version }}-

      # Sync the visual Python extra concurrently with the app + runner build (the extra is
      # independent of the build): the pixel-compare deps `make e2e-visual` needs. A build failure
      # exits first under `set -e`; the trap stops the background sync so it doesn't trail on a
      # metered runner.
      - name: Build the app + runner (fetch visual deps concurrently)
        run: |
          uv sync --extra visual --no-dev &
          sync_pid=$!
          trap 'kill "$sync_pid" 2>/dev/null || true' EXIT
          make -C demos/showcase swiftui-build
          make -C demos/showcase runner-build
          wait "$sync_pid"
          trap - EXIT

      - name: Wait for the Simulator
        run: xcrun simctl bootstatus "${{ steps.toolchain.outputs.udid }}" -b

      # As in the two pytest lanes above: this job drives `make`, not the bajutsu-e2e action, so it
      # wires the BE-0361 diagnostics itself.
      - name: Start iOS diagnostics
        # An observer may never decide this job: the step's own shell disables errexit and exits 0, and
        # this is the outer net for anything that gets past it (BE-0361). A lane that reddens because
        # its *diagnostics* fell over reports nothing about the software under test.
        continue-on-error: true
        uses: ./.github/actions/collect-ios-diagnostics
        with:
          phase: start
          udid: ${{ steps.toolchain.outputs.udid }}

      # Run the committed pixel VRT over XCUITest. `make e2e-visual` (demos/showcase/Makefile)
      # installs the freshly-built app, drives the Stable catalog on the launch tab, and
      # pixel-compares it against baselines_ios/stable.png with the status bar + tab bar masked.
      - name: Run the visual regression (VRT, pixel snapshot)
        id: vrt
        run: make -C demos/showcase e2e-visual SIM=${{ steps.toolchain.outputs.udid }}

      - name: Collect iOS diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/collect-ios-diagnostics
        with:
          phase: collect
          udid: ${{ steps.toolchain.outputs.udid }}
          failed: ${{ steps.vrt.outcome != 'success' }}

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ios-e2e-visual-run
          path: runs/
          if-no-files-found: ignore

  # Single required status check for E2E. Always runs so it reports even when the macOS
  # jobs are skipped (docs-only PRs) — a skipped dependency is a pass; only a real
  # failure or cancellation fails the gate. `actuation`, `golden`, `visual`, and `fault-injection`
  # are deliberately excluded from `needs:` (see each job's comment) so newly-wired actuation
  # (BE-0281), a host-specific pixel drift, or the deliberately-hostile fault-injection lane
  # (BE-0305) never blocks a merge. Make `E2E` the required check, not the path-gated macOS jobs.
  e2e:
    name: E2E (iOS)
    needs: [changes, build, run, codegen, bundled-runner, conformance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check E2E results
        env:
          BUILD: ${{ needs.build.result }}
          RUN: ${{ needs.run.result }}
          CODEGEN: ${{ needs.codegen.result }}
          BUNDLED_RUNNER: ${{ needs.bundled-runner.result }}
          CONFORMANCE: ${{ needs.conformance.result }}
        run: |
          echo "build=$BUILD run=$RUN codegen=$CODEGEN bundled_runner=$BUNDLED_RUNNER conformance=$CONFORMANCE"
          for result in "$BUILD" "$RUN" "$CODEGEN" "$BUNDLED_RUNNER" "$CONFORMANCE"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "E2E failed"
              exit 1
            fi
          done
          echo "E2E passed (or skipped — no on-device change)"
