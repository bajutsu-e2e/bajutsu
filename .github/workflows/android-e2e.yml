# On-device Android e2e (Linux + KVM) — the third backend's lane, the Android twin of the iOS
# `ios-e2e.yml` (macOS / XCUITest) and `web-e2e.yml` (Linux / Playwright). It boots an AVD under KVM on a
# Linux runner and drives the showcase over `--backend android` (the adb driver, BE-0007), asserting
# deterministic pass/fail. Like the iOS and web lanes, the work is split into per-concern jobs so a
# red check names the capability that broke from the checks list alone, not one bundled pass/fail:
#   - smoke (adb): the functional heart — run the core scenarios through `bajutsu run`, against both
#     Android UI toolkits (Compose over the full `E2E_SCENARIOS`, Views over the Stable-tab
#     `E2E_VIEWS_SCENARIOS` subset; `components`/`modals` stay Compose-only for now), the sets
#     defined in the Android Makefile. Each scenario's selectors list both id forms (BE-0221).
#   - golden (adb): the BE-0006 element-tree golden over the resident channel, then re-run with the
#     resident channel forced off (`e2e-fallback`, BAJUTSU_ADB_RESIDENT=0) so both the resident path
#     (BE-0245) and the `uiautomator dump` fallback are exercised and proven to yield the same tree.
#     `fallback` is a step in this job, not a fourth job — it is the same golden on the other read
#     channel, so a separate job would rebuild the APK and reboot the AVD to assert the same tree.
#   - visual (adb): the pixel VRT against the CI-recorded baseline. A pixel baseline is host-specific,
#     so — like ios-e2e.yml's `visual` and web-e2e.yml's lanes — it is a non-gating signal.
#   - network (adb): the BE-0283 network-capture assertion — a `request` observes real emulator
#     traffic reported through BajutsuAndroid's interceptor over the `adb reverse` collector bridge.
#   - conformance (adb): the BE-0114 driver conformance contract (tests/driver_conformance.py) run
#     on-device against the adb driver (BE-0270) — the Android twin of ios-e2e.yml's `conformance
#     (xcuitest)`. It proves the determinism-core invariants (an ambiguous selector fails, a
#     zero-match fails, `capabilities()` matches behavior, condition-backed waits) hold on the real
#     actuator, which smoke/golden/visual cannot cover (they drive unambiguous selectors only). Unlike
#     the other jobs it runs pytest, not the run CLI, so it keeps the dev group.
#   - fault-injection (adb): real fault injection for the read path (BE-0305). Every job above waits a
#     screen ready before reading it, so none ever meets the degenerate accessibility tree
#     `CoordinateTreeDriver`'s transient-empty retry exists for. This one puts the display to sleep, so
#     the real read really is empty, and checks the retry rides over it instead of raising a false
#     "element not found". A non-gating signal first, like `codegen` below.
#   - uiautomator (codegen) (adb): the codegen output path (BE-0294) — generate a native UI Automator
#     (Kotlin) test from a scenario and run it with Gradle's connectedAndroidTest, no bajutsu / adb
#     driver / AI at test time. The Android twin of ios-e2e.yml's `codegen (xcuitest)`; a non-gating
#     signal first (the signal-then-required precedent of BE-0282), promoted to the gate once stable.
#   - warm gradle cache (adb): builds the Compose + resident UI Automator server APKs that `smoke`,
#     `golden`, `conformance`, and `fault-injection` all build, with no AVD, purely so those four
#     jobs' own unchanged `make ... build` invocations restore a warm Gradle dependency + build cache
#     instead of resolving/compiling cold four times over. It does NOT build Views: `smoke` alone
#     needs Views, and warming it here would make `golden`/`conformance`/`fault-injection` wait
#     (`needs:` is a job-level gate) on a Views compile none of the three ever uses — `smoke`'s own
#     Views build stays cold, unwarmed, exactly as it was before this job existed. `actions/cache`
#     cannot share a still-unsaved cache between jobs running concurrently in the same run, so this
#     runs first and the four dependent jobs declare `needs: warm-gradle-cache`; none of them passes
#     `cache-read-only` explicitly — they rely on the composite action's own safe default ('true',
#     read-only) — the multi-job cache-sharing pattern gradle/actions documents. It does not replace
#     each job's own build step or bundle APKs into a shared artifact. `network`, `visual`, and
#     `codegen` are deliberately NOT gated on it: they build Compose only (`codegen`'s own
#     `e2e-codegen` additionally needs the Compose AndroidTest/instrumentation variant, which this job
#     never builds), so — because `needs:` would block even their unrelated AVD-cache step until this
#     job finishes — waiting for it would cost those three jobs more than any cache hit could save;
#     the same "different subsets" reasoning above, applied per job rather than used to justify one
#     shared artifact for the whole lane. A `warm-gradle-cache` miss or outright failure only costs
#     time, never correctness — each of the four dependent jobs' `if:` uses `!cancelled()` plus an
#     explicit `changes` check rather than a hard `needs` dependency on its success, so a flake or
#     genuine failure in the warm-up never blocks the functional job it only exists to speed up, while
#     a run superseded by this file's own `concurrency: cancel-in-progress` still stands down instead
#     of being dispatched anyway (which bare `always()` would allow); each falls back to its own cold
#     build, same as today.
# It runs no LLM — a deterministic `run` over fixed scenarios — so it stays within the prime
# directives, and it is kept off the fast `make check` gate exactly as the iOS and web e2e lanes are.
# The lane now carries a REQUIRED status check like iOS's `E2E`: the `E2E (android)` job below
# `needs` the deterministic host-independent jobs (`smoke`, `conformance`, `network`) and always reports (a
# path-skip is a pass), so it — not the KVM jobs, which are path-gated — is what `main`'s
# branch-protection ruleset pins. `golden`, `visual`, `codegen`, and `fault-injection` are deliberately
# NOT part of its
# `needs:`: a pixel baseline is host-specific (the x86_64 software renderer varies), the element-tree
# golden can drift with an upstream dependency, and the codegen (BE-0294) and fault-injection (BE-0305)
# lanes land as per-PR signals first, so each stays a per-PR signal that never blocks a merge — the same
# deterministic-and-host-independent boundary iOS's `E2E` already draws. Each job boots its
# own AVD and builds its own APKs; unlike iOS's metered macOS runners (10x billing), Android runs on
# standard-priced Linux under KVM, so the per-job cost is acceptable for the attribution win a red
# job's name gives for free. `warm-gradle-cache` (see below) only removes the redundant dependency
# resolution and compilation underneath those unchanged per-job builds — it does not merge the jobs
# or their AVDs. Per-job setup is otherwise duplicated the same way ios-e2e.yml duplicates its own —
# no composite action beyond the shared toolchain prelude.
#
# The AVD is x86_64 API 34, not the arm64 image the local 2026-07-07 validation used: KVM
# acceleration on the x86_64 GitHub Linux runner needs an x86_64 system image, and a foreign-arch
# (arm64) image would fall back to slow software emulation and time the job out. The API level (34)
# matches the local validation; only the ABI tracks the CI host.
#
# Because `E2E (android)` is a required check, the lane can't be path-gated at the trigger — a
# required check skipped by a `paths:` filter stays pending forever and blocks the merge. So it
# triggers on every PR (and the merge queue) and the `changes` job path-gates the KVM jobs instead,
# running scripts/e2e_changes.py with E2E_LANE=android (the positive-list of adb-relevant paths — the
# adb driver + resident channel, the run pipeline and scenario loader, the `bajutsu run` and (for the
# codegen lane, BE-0294) `bajutsu codegen` CLI entries,
# the Android showcase and shared scenarios, the app-side SDKs BajutsuAndroid/BajutsuAndroidUIAutomatorServer,
# the config, and this workflow — unit-tested in tests/test_e2e_changes.py). A new adb-relevant path
# defaults to NOT triggering — add it to that module's `android` fragment.
name: Android E2E (emulator)

on:
  workflow_dispatch:
    inputs:
      poll_cpuinfo:
        description: >-
          Poll `dumpsys cpuinfo` during smoke (adb) (BE-XXXX-adb-device-side-actuation flake hunting
          only). Off by default: it adds continuous adb traffic and host load to the very lane whose
          CPU contention it measures, an observer effect that has no place in every PR's run.
        type: boolean
        default: false
  # Trigger on every PR so the `E2E (android)` gate job always reports a status (a required check
  # that never runs stays pending and blocks merges). The metered KVM jobs themselves are path-gated
  # by the `changes` job below — a PR that can't affect the adb path skips them and the gate passes.
  pull_request:
  # Also run in the merge queue: `E2E (android)` is a required check, and a required check that never
  # reports on `merge_group` leaves the queue entry pending until it times out.
  merge_group:

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide whether a KVM run is warranted. The emulator jobs only fire when the PR touches what they
  # exercise — the adb driver, the run path, the Android showcase and app SDKs, or this workflow. The
  # decision lives in scripts/e2e_changes.py (E2E_LANE=android) so it is unit-tested — the Android
  # twin of ios-e2e.yml's `changes` job. The `E2E (android)` aggregator always reports, so an
  # unrelated PR is neither run nor blocked.
  changes:
    name: detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so the script's merge-base (three-dot) diff can find the PR's fork point.
          fetch-depth: 0
      - name: Detect relevant paths
        id: filter
        env:
          E2E_LANE: android
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: python3 scripts/e2e_changes.py

  # Warm the shared Gradle cache once, ahead of the four KVM jobs below that depend on it (see the
  # header comment for why this exists, why `network`/`visual`/`codegen` are excluded, and why it
  # stays a soft, best-effort dependency rather than a shared build). No AVD here — building the same
  # APKs those four jobs build, without booting anything, is a few minutes.
  warm-gradle-cache:
    name: warm gradle cache (adb)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Explicit 'false' to opt out of this action's own safe default ('true', read-only) and write
      # the cache on every PR/merge-queue run, not only on `main` (gradle/actions/setup-gradle's own
      # default).
      - name: Set up the Android toolchain
        uses: ./.github/actions/setup-android-toolchain
        with:
          cache-read-only: 'false'

      # No `uv sync` here: the two `make` targets below are pure `./gradlew` invocations with no
      # Python/uv dependency, so a package install would only add wall-clock time nothing consumes.

      # Build the Compose + resident-server APKs the four dependent jobs share (not Views: only
      # `smoke` needs it, and warming it here would make the other three wait on a compile they never
      # use — see the header comment), so their own (read-only) `make` invocations hit a warm
      # dependency + build cache instead of resolving/compiling cold.
      - name: Build the Compose showcase APK
        run: make -C demos/showcase/android compose-build

      - name: Build the resident UI Automator server APKs
        run: make -C BajutsuAndroidUIAutomatorServer build

  # The functional heart: run the core scenarios through `bajutsu run` over the adb backend, against
  # both Android UI toolkits (Compose full set + Views Stable-tab subset, BE-0221). This is the "does
  # bajutsu drive Android?" check — the Android twin of ios-e2e.yml's `smoke (xcuitest)` and web-e2e.yml's
  # `smoke (playwright)`. Builds both a11y APKs and the resident UI Automator server (BE-0245) so the
  # reads go over the resident channel by default (bajutsu/platform_lifecycle.py).
  smoke:
    name: smoke (adb)
    needs: &warm-cache-consumer-needs [changes, warm-gradle-cache]
    # `!cancelled()`, not `always()`: it must still tolerate a warm-gradle-cache flake or failure
    # without blocking this functional job, but `always()` would also re-dispatch it after the run
    # itself was superseded by this file's own `concurrency: cancel-in-progress` — `!cancelled()`
    # stands down there instead. `changes` itself must still have succeeded and reported a relevant
    # change. Anchored here and aliased by golden/conformance/fault-injection below, so editing this
    # one `if:` keeps all four in sync instead of relying on a hand-kept "keep these together" rule.
    if: &warm-cache-consumer-if "!cancelled() && needs.changes.result == 'success' && needs.changes.outputs.relevant == 'true'"
    runs-on: ubuntu-latest
    # A cold AVD boot + APK builds + the Compose full set and Views subset is ~18min; 30 catches a
    # real hang (a wedged AVD boot or adb) with comfortable headroom.
    timeout-minutes: 30
    # The adb backend is pure subprocess (no Python extra), so the base package suffices; skip the
    # dev group (mypy / pytest / ruff), which the Linux `check` gate owns.
    #
    # This job runs the largest scenario set in the lane (Compose full set + Views subset), so it is
    # the one most exposed to a mid-run backend crash (BAJUTSU_CRASH_RETRIES/
    # BAJUTSU_CRASH_RECOVERY_BUDGET, bajutsu/runner/pipeline.py) — unset elsewhere in this workflow,
    # falling back to one retry and an unbounded per-scenario budget. These two numbers were sized
    # against a *bare* in-place respawn and, unlike ios-e2e.yml's own knobs (re-derived in 2115b10),
    # were not re-measured once a crash-triggered retry (attempt > 1) started forcing the same `erase`
    # precondition `erase: true` already gets. The reason they still hold on this lane: `pre.erase` on
    # adb (`bajutsu/platform_lifecycle/environments/android.py`) is an app-level clean state —
    # `uninstall` + `install` + `pm clear` on an emulator that stays booted throughout — not the
    # `simctl shutdown → erase → boot` device restart iOS pays, so the erase-carrying attempt costs low
    # tens of seconds on top of a bare respawn, not the extra ≈360s (the full STARTUP_TIMEOUT ceiling
    # plus erase/boot/install prep) that made ios-e2e.yml's own budget bound roughly one retry instead
    # of the full count. 2 retries (three attempts) still comfortably fits in 180s on that basis; a lane
    # that changes the a11y APKs' size or Android's own erase path enough to challenge that should
    # re-derive this the way ios-e2e.yml's comment above BAJUTSU_CRASH_RECOVERY_BUDGET does.
    # BAJUTSU_RUN_CRASH_RECOVERY_BUDGET (_default_run_crash_recovery_budget) is the run-scoped
    # counterpart: it caps crash-recovery time across every scenario in one `bajutsu run` process, not
    # per scenario. On this lane that scope is narrower than it sounds: `make -C
    # demos/showcase/android e2e` shells one `bajutsu run --scenario …` per file, 28 separate
    # invocations (E2E_SCENARIOS + E2E_VIEWS_SCENARIOS), each getting its own fresh 480s budget — not
    # the single job-wide budget ios-e2e.yml's `run`/`actuation` jobs get by folding many scenarios into
    # one invocation. Most of those files hold one scenario, and a scenario can never observe its own
    # in-progress spend (billed only once its own retry loop ends), so on this lane the budget is inert
    # for the common case rather than a lane-wide backstop: it only bounds a file that itself sequences
    # more than one scenario. Set to keep parity with the per-scenario knobs above and to bound the few
    # multi-scenario files that do exist here, not on a claim that it caps the whole job — a
    # systemically degrading emulator still runs every one of the 28 invocations to this job's 30min
    # `timeout-minutes` regardless of this knob.
    env:
      UV_NO_DEV: "1"
      BAJUTSU_CRASH_RETRIES: "2"
      BAJUTSU_CRASH_RECOVERY_BUDGET: "180"
      BAJUTSU_RUN_CRASH_RECOVERY_BUDGET: "480"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the Android toolchain
        uses: ./.github/actions/setup-android-toolchain

      - name: Install the base package (no dev)
        run: uv sync --no-dev

      # Build both a11y APKs outside the emulator session so the AVD is only alive during the run
      # itself; bajutsu's launch installs each from the config's appPath. Views joins Compose
      # (BE-0221): the Stable-tab subset drives both toolkits, whose ids differ only in `.`/`-` vs
      # `_` — each scenario's selectors list both forms.
      - name: Build the Compose + Views showcase APKs
        run: make -C demos/showcase/android compose-build views-build

      # Build the resident UI Automator server APKs (BE-0245) so the adb backend's reads run over the
      # resident channel by default (bajutsu/platform_lifecycle.py).
      - name: Build the resident UI Automator server APKs
        run: make -C BajutsuAndroidUIAutomatorServer build

      # Cache the AVD system image + snapshot so the boot is warm across runs (the canonical
      # android-emulator-runner recipe): create-and-snapshot on a miss, then reuse it on the run.
      - name: Cache AVD
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Suffixed with the emulator-options hardware profile (memory, cores) below — a resumed
          # snapshot's machine config must match the one it was saved with, and this key is otherwise
          # a fixed string shared by every job. A memory/cores change with no matching key change hits
          # a now-incompatible cached snapshot: the emulator logs "Failed to load snapshot" and falls
          # back to a full cold boot, which is slower and leaves the system settling (package manager,
          # GC) for longer — exactly the window in which the `search` scenario's app process was seen
          # killed and relaunched mid-run (a black frame straight to the Stable tab, losing its typed
          # query) on `-cores 1` once this key stopped matching. Bump this suffix in lockstep with
          # `-memory`/`-cores` below so a hardware change always earns a fresh, matching cache entry.
          key: avd-api34-x86_64-pixel6-mem8192-cores2

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # Pin the device profile so the CI emulator's screen geometry matches the local arm64
          # validation (pixel_6). The deep-scroll scenarios (`notices`, `controls`) reach a far target
          # with a fixed number of screen-fraction swipes, sized for this device — a different default
          # profile scrolls a different number of rows per swipe and never reaches the target (BE-0208).
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -memory 8192 -cores 2 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Sample the Linux host's own load for the whole emulator step (BE-0367 Layer 3). It reads
      # only the host, so it can bracket that step from outside — which is also what lets it cover a
      # job whose emulator step dies outright.
      - name: Start host telemetry
        uses: ./.github/actions/collect-android-diagnostics
        with:
          phase: start

      # Boot the AVD under KVM and run the core scenarios over the adb backend (the action owns
      # boot + readiness; the default serial `booted` resolves to the one running emulator). The
      # onboarding gate (BE-0304) runs first, inside the emulator session where a device is attached:
      # `bajutsu doctor --environment-only` must report no ✗ in its `environment:` section, exercising
      # the real `adb` presence check and attached-device count through the real actuator — the drift
      # no injected-fake unit test can see. It must run here (not as a plain step) because the
      # environment gate counts attached devices, which only exist while this action holds the
      # emulator up. A ✗ fails the step and this gating job before the scenarios run.
      - name: Run the core scenarios (adb)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        env:
          # Only ever "true" on a deliberate `workflow_dispatch` with the input set — `pull_request`
          # and `merge_group` events carry no `inputs`, so this is unset (falsy) there. Read as an
          # env var rather than interpolated into `script` directly, so the value crosses the
          # expression/shell boundary as data, never as YAML-into-shell text.
          POLL_CPUINFO: ${{ github.event.inputs.poll_cpuinfo || 'false' }}
          # Turn on bajutsu's own stall-time probe (BE-0367 Layer 1): at the moment the resident read
          # channel dies or a recording is confirmed to be producing no bytes, capture the device and
          # host state that is about to be overwritten. Absolute, because each `make` target `cd`s to
          # the repo root and this must not depend on any one of them doing so.
          BAJUTSU_STALL_DIAGNOSTICS: ${{ github.workspace }}/runs/diagnostics/stalls
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6  # match the local validation geometry (see the create-AVD step above)
          force-avd-creation: false
          emulator-options: -memory 8192 -cores 2 -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          # The emulator-runner runs each script *line* as its own `/usr/bin/sh -c`, so a `set -e`
          # line and backslash continuations don't carry across lines. Keep it one command joined
          # with `&&` (the folded scalar collapses to a single line), so a ✗ from the doctor gate
          # short-circuits before `make e2e` and fails the job — the drift this gate exists to catch,
          # which a two-statement script would mask by returning only `make e2e`'s exit code.
          #
          # A background `dumpsys cpuinfo` poller can run alongside the scenarios, appending a
          # timestamped snapshot to `runs/cpuinfo.log` every 2s, so a deliberate flake-hunting
          # dispatch (BE-XXXX-adb-device-side-actuation) can be checked against host CPU pressure —
          # the emulator-options bump above raises the ceiling but does not prove contention was the
          # cause. Gated on `POLL_CPUINFO` (off for every `pull_request`/`merge_group` run): polling
          # every 2s is itself continuous adb traffic and host load on the very lane whose CPU
          # contention it measures, an observer effect this workflow's regular runs should not pay.
          # When it runs, it is killed and the real exit code preserved (`rc`) so it never masks a
          # scenario failure; the log rides on the existing "Upload run artifacts" step below since
          # it is written under `runs/`.
          #
          # The device-side diagnostics sweep (BE-0367 Layer 2) rides on that same preserved `rc`,
          # and for the same reason it has to run *here* rather than as a later step: the emulator
          # lives only as long as this action's own step, so a step placed after it — even one gated
          # on `if: failure()` — would sweep a machine with no device attached.
          script: >-
            if [ "$POLL_CPUINFO" = "true" ]; then mkdir -p runs && ( while true; do { date -u
            +%Y-%m-%dT%H:%M:%S.%3NZ; adb shell dumpsys cpuinfo; } >>runs/cpuinfo.log 2>&1; sleep 2;
            done & echo $! >/tmp/cpuinfo.pid ); fi
            && uv run --no-sync python scripts/assert_doctor_env.py --expect ok
            --target showcase-compose --backend android
            --config demos/showcase/showcase.config.yaml
            && make -C demos/showcase/android e2e
            ; rc=$?
            ; if [ "$POLL_CPUINFO" = "true" ]; then kill "$(cat /tmp/cpuinfo.pid)" 2>/dev/null; fi
            ; scripts/collect_android_diagnostics.sh "$rc" || true
            ; exit $rc

      - name: Collect host telemetry
        if: always()
        uses: ./.github/actions/collect-android-diagnostics
        with:
          phase: collect

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: android-e2e-smoke-run
          path: runs/
          if-no-files-found: ignore

  # The BE-0006 element-tree golden: pins the normalized adb accessibility tree for the Stable
  # catalog. Runs the golden over the resident channel (server APKs built below, so it is on by
  # default, BE-0245), then re-runs it with BAJUTSU_ADB_RESIDENT=0 (`e2e-fallback`) so the
  # `uiautomator dump` fallback is exercised too and the golden proves both channels yield the same
  # tree. The Android twin of the iOS golden ios-e2e.yml now runs per PR.
  golden:
    name: golden (adb)
    needs: *warm-cache-consumer-needs
    # Same soft dependency as `smoke` above (aliased) — see its comment for why.
    if: *warm-cache-consumer-if
    runs-on: ubuntu-latest
    # The golden reruns the Stable-tab scenario twice (resident + dump) against a booted AVD; ~15min
    # end to end, so 25 catches a real hang with headroom.
    timeout-minutes: 25
    env:
      UV_NO_DEV: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the Android toolchain
        uses: ./.github/actions/setup-android-toolchain

      - name: Install the base package (no dev)
        run: uv sync --no-dev

      # The golden asserts the Compose a11y tree; the resident server flips reads onto the resident
      # channel by default so the `e2e-golden` step exercises it, and `e2e-fallback` forces it off.
      - name: Build the Compose showcase APK
        run: make -C demos/showcase/android compose-build

      - name: Build the resident UI Automator server APKs
        run: make -C BajutsuAndroidUIAutomatorServer build

      - name: Cache AVD
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-pixel6-mem8192-cores2

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -memory 8192 -cores 2 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Layer 3, bracketing the emulator step — see `smoke`'s own pair for why it can be a step.
      - name: Start host telemetry
        uses: ./.github/actions/collect-android-diagnostics
        with:
          phase: start

      # `e2e-golden` reads over the resident channel (server APKs built above); `e2e-fallback`
      # re-runs the same golden with the channel forced off, so both paths are exercised and the
      # golden proves they yield the same tree.
      - name: Run the element-tree golden over both read channels (adb)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        env:
          BAJUTSU_STALL_DIAGNOSTICS: ${{ github.workspace }}/runs/diagnostics/stalls
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -memory 8192 -cores 2 -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          # The device-side sweep runs from inside this step, on the preserved `rc` — see `smoke`'s
          # own `script:` for why it cannot be a later step.
          script: >-
            make -C demos/showcase/android e2e-golden
            && make -C demos/showcase/android e2e-fallback
            ; rc=$?
            ; scripts/collect_android_diagnostics.sh "$rc" || true
            ; exit $rc

      - name: Collect host telemetry
        if: always()
        uses: ./.github/actions/collect-android-diagnostics
        with:
          phase: collect

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: android-e2e-golden-run
          path: runs/
          if-no-files-found: ignore

  # On-device network capture (BE-0283): a `request` assertion observes real emulator traffic end to
  # end. The showcase GETs SHOWCASE_API_URL/horses over OkHttp, BajutsuAndroid's interceptor reports
  # the exchange to the host collector, and the runner bridges that collector to the emulator with
  # `adb reverse` (the transport this item delivers). `e2e-network` runs a throwaway host stub the
  # emulator reaches at 10.0.2.2 and points SHOWCASE_API_URL there. Reads are minimal (wait Refresh,
  # tap, wait status), so — like the visual job — the resident server is not built (dump suffices).
  network:
    name: network (adb)
    # Not gated on warm-gradle-cache — see the header comment for why.
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    # A cold AVD boot + the Compose build + one network scenario is ~12min; 25 catches a real hang.
    timeout-minutes: 25
    env:
      UV_NO_DEV: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the Android toolchain
        uses: ./.github/actions/setup-android-toolchain

      - name: Install the base package (no dev)
        run: uv sync --no-dev

      # The scenario drives the Compose a11y twin; bajutsu's launch installs it from the config's appPath.
      - name: Build the Compose showcase APK
        run: make -C demos/showcase/android compose-build

      - name: Cache AVD
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-pixel6-mem8192-cores2

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -memory 8192 -cores 2 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Layer 3, bracketing the emulator step — see `smoke`'s own pair for why it can be a step.
      - name: Start host telemetry
        uses: ./.github/actions/collect-android-diagnostics
        with:
          phase: start

      - name: Run the network-capture scenario (adb)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        env:
          BAJUTSU_STALL_DIAGNOSTICS: ${{ github.workspace }}/runs/diagnostics/stalls
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -memory 8192 -cores 2 -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          # The device-side sweep runs from inside this step, on the preserved `rc` — see `smoke`'s
          # own `script:` for why it cannot be a later step.
          script: >-
            make -C demos/showcase/android e2e-network
            ; rc=$?
            ; scripts/collect_android_diagnostics.sh "$rc" || true
            ; exit $rc

      - name: Collect host telemetry
        if: always()
        uses: ./.github/actions/collect-android-diagnostics
        with:
          phase: collect

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: android-e2e-network-run
          path: runs/
          if-no-files-found: ignore

  # The driver conformance suite (BE-0114): one backend-agnostic contract, run on-device against the
  # adb driver (BE-0270) — the Android twin of ios-e2e.yml's `conformance (xcuitest)`. It proves
  # the determinism-core invariants (ambiguous selector fails, zero-match fails, capabilities() matches
  # behavior, condition-backed waits) hold on the real actuator, which smoke/golden/visual cannot cover
  # (they drive unambiguous selectors only). `launch_driver` boots the showcase straight into
  # ConformanceScreen and the suite reseeds it over `am start`; the resident server APKs are built so
  # reads run over the resident channel (BE-0245), the adb-specific read path the contract now pins.
  conformance:
    name: conformance (adb)
    needs: *warm-cache-consumer-needs
    # Same soft dependency as `smoke` above (aliased) — see its comment for why.
    if: *warm-cache-consumer-if
    runs-on: ubuntu-latest
    # A cold AVD boot + the Compose + resident-server builds + the contract (a handful of reseeds) is
    # ~15min; 25 catches a real hang (a wedged AVD boot or adb) with headroom.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the Android toolchain
        uses: ./.github/actions/setup-android-toolchain

      # Unlike the smoke / golden / visual jobs, this one drives the contract through pytest, not the
      # run CLI, so it keeps the dev group (pytest / pytest-xdist / mypy stack). The adb backend itself
      # needs no extra.
      - name: Install the package with the dev group
        run: uv sync

      # `launch_driver` installs the a11y APK from the config's appPath and boots into ConformanceScreen.
      - name: Build the Compose showcase APK
        run: make -C demos/showcase/android compose-build

      # Build the resident UI Automator server APKs (BE-0245) so the reads run over the resident channel
      # by default (bajutsu/platform_lifecycle.py) — the adb-specific read path the contract now pins.
      - name: Build the resident UI Automator server APKs
        run: make -C BajutsuAndroidUIAutomatorServer build

      - name: Cache AVD
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-pixel6-mem8192-cores2

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -memory 8192 -cores 2 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Layer 3, bracketing the emulator step — see `smoke`'s own pair for why it can be a step.
      - name: Start host telemetry
        uses: ./.github/actions/collect-android-diagnostics
        with:
          phase: start

      # `e2e-conformance` runs `adb root` (the MULTI_TOUCH pinch/rotate test needs the rooted
      # `sendevent` sweep, BE-0232) then the `ondevice`-marked contract serially (`-n0`) against the one
      # booted emulator.
      - name: Run the driver conformance contract (adb)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        env:
          BAJUTSU_STALL_DIAGNOSTICS: ${{ github.workspace }}/runs/diagnostics/stalls
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -memory 8192 -cores 2 -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          # The device-side sweep runs from inside this step, on the preserved `rc` — see `smoke`'s
          # own `script:` for why it cannot be a later step.
          script: >-
            make -C demos/showcase/android e2e-conformance
            ; rc=$?
            ; scripts/collect_android_diagnostics.sh "$rc" || true
            ; exit $rc

      - name: Collect host telemetry
        if: always()
        uses: ./.github/actions/collect-android-diagnostics
        with:
          phase: collect

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: android-e2e-conformance-run
          path: runs/
          if-no-files-found: ignore

  # Fault injection for the adb read path (BE-0305): the conformance suite above waits every screen
  # ready before it reads, so it never meets the degenerate accessibility tree
  # `CoordinateTreeDriver`'s transient-empty retry exists for — that retry is exercised only by a
  # fabricated count sequence in the fast suite. This job injects the real condition (a display put to
  # sleep, whose real read really is empty) and checks the retry rides over it rather than surfacing a
  # false "element not found". The resident server APKs are built so the fault lands on the channel the
  # other jobs read over (BE-0245), not only on the `uiautomator dump` fallback.
  #
  # A signal, not a gate: deliberately outside the `E2E (android)` aggregate's `needs:` below. A lane
  # that deliberately breaks the device carries more inherent flakiness risk than one driving a healthy
  # one, so it lands as a per-PR signal and is promoted only once stable — the same signal-then-required
  # path BE-0282's network lane took.
  fault-injection:
    name: fault-injection (adb)
    needs: *warm-cache-consumer-needs
    # Same soft dependency as `smoke` above (aliased) — see its comment for why.
    if: *warm-cache-consumer-if
    runs-on: ubuntu-latest
    # A cold AVD boot + the Compose + resident-server builds + two short cases (~1min on a local
    # emulator, the slower `uiautomator dump` path bounded by the cases' own budgets) is well under
    # this; 25 catches a wedged AVD boot or adb with headroom, like the jobs above.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the Android toolchain
        uses: ./.github/actions/setup-android-toolchain

      # Drives pytest, not the run CLI (like `conformance` above), so it keeps the dev group.
      - name: Install the package with the dev group
        run: uv sync

      # `launch_driver` installs the a11y APK from the config's appPath and launches it.
      - name: Build the Compose showcase APK
        run: make -C demos/showcase/android compose-build

      # Build the resident UI Automator server APKs (BE-0245) so the injected fault reaches the resident
      # read channel the other jobs use, not just the `uiautomator dump` fallback behind it.
      - name: Build the resident UI Automator server APKs
        run: make -C BajutsuAndroidUIAutomatorServer build

      - name: Cache AVD
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-pixel6-mem8192-cores2

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -memory 8192 -cores 2 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Layer 3, bracketing the emulator step — see `smoke`'s own pair for why it can be a step.
      - name: Start host telemetry
        uses: ./.github/actions/collect-android-diagnostics
        with:
          phase: start

      # `e2e-fault-injection` runs the `ondevice`-marked cases serially (`-n0`) against the one booted
      # emulator, and leaves the display awake however they end.
      - name: Run the adb fault injection (transient-empty retry)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        env:
          BAJUTSU_STALL_DIAGNOSTICS: ${{ github.workspace }}/runs/diagnostics/stalls
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -memory 8192 -cores 2 -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          # The device-side sweep runs from inside this step, on the preserved `rc` — see `smoke`'s
          # own `script:` for why it cannot be a later step.
          script: >-
            make -C demos/showcase/android e2e-fault-injection
            ; rc=$?
            ; scripts/collect_android_diagnostics.sh "$rc" || true
            ; exit $rc

      - name: Collect host telemetry
        if: always()
        uses: ./.github/actions/collect-android-diagnostics
        with:
          phase: collect

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: android-e2e-fault-injection-run
          path: runs/
          if-no-files-found: ignore

  # The pixel VRT (BE-0208 unit 4 visual dimension): pixel-compare the Stable catalog against the
  # CI-recorded baseline (demos/showcase/scenarios/visual/baselines_android/). A pixel baseline is
  # host-specific — the CI x86_64 software renderer (swiftshader) and a local arm64 emulator diverge
  # per pixel — so the baseline is recorded on this lane and committed (see that dir's README); this
  # job compares against it. Like ios-e2e.yml's `visual`, this is a signal, not a gate.
  visual:
    name: visual (adb)
    # Not gated on warm-gradle-cache — see the header comment for why.
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    # A cold AVD boot + the Compose build + one pixel VRT run is ~12min; 25 catches a real hang.
    timeout-minutes: 25
    env:
      UV_NO_DEV: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the Android toolchain
        uses: ./.github/actions/setup-android-toolchain

      # The pixel compare needs Pillow (the `visual` extra); the adb backend itself has none. Sync it
      # here (still no dev group) so `make e2e-visual` finds it.
      - name: Install the base package + visual extra (no dev)
        run: uv sync --no-dev --extra visual

      # The VRT drives the Stable launch tab and screenshots it — an element-tree read channel is not
      # asserted, so the resident server is not built here (reads fall back to `uiautomator dump`).
      - name: Build the Compose showcase APK
        run: make -C demos/showcase/android compose-build

      - name: Cache AVD
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-pixel6-mem8192-cores2

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -memory 8192 -cores 2 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Layer 3, bracketing the emulator step — see `smoke`'s own pair for why it can be a step.
      - name: Start host telemetry
        uses: ./.github/actions/collect-android-diagnostics
        with:
          phase: start

      - name: Run the visual regression (VRT, pixel snapshot) (adb)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        env:
          BAJUTSU_STALL_DIAGNOSTICS: ${{ github.workspace }}/runs/diagnostics/stalls
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -memory 8192 -cores 2 -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          # The device-side sweep runs from inside this step, on the preserved `rc` — see `smoke`'s
          # own `script:` for why it cannot be a later step.
          script: >-
            make -C demos/showcase/android e2e-visual
            ; rc=$?
            ; scripts/collect_android_diagnostics.sh "$rc" || true
            ; exit $rc

      - name: Collect host telemetry
        if: always()
        uses: ./.github/actions/collect-android-diagnostics
        with:
          phase: collect

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: android-e2e-visual-run
          path: runs/
          if-no-files-found: ignore

  # The codegen output path (BE-0294): a scenario -> native UI Automator (Kotlin) test, compiled and
  # run by Gradle's connectedAndroidTest with no bajutsu / adb driver / AI at test time. This is the
  # Android twin of ios-e2e.yml's `codegen (xcuitest)` — the claim codegen makes about its UI Automator
  # target, which the string-only unit suite (tests/test_codegen_uiautomator.py) cannot prove: it
  # checks the emitted text, never whether the Kotlin parses or the referenced androidx.test.uiautomator
  # APIs exist at the pinned version. `make e2e-codegen` re-generates the checked-in test, builds the
  # a11y app + instrumentation APKs, installs both, and runs the generated test against the emulator.
  codegen:
    name: uiautomator (codegen)
    # Not gated on warm-gradle-cache (see the header comment): `e2e-codegen` needs the Compose
    # AndroidTest/instrumentation variant, which warm-gradle-cache never builds, so `needs:` would
    # only cost this job the wait (including its unrelated AVD-cache step) for a superset build it
    # barely benefits from.
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    # A cold AVD boot + the Compose app + instrumentation builds + one generated test is ~15min; 25
    # catches a real hang (a wedged AVD boot or a stuck instrumentation) with headroom.
    timeout-minutes: 25
    # `make e2e-codegen` re-generates the test with `uv run bajutsu codegen`, whose auto-sync would
    # otherwise pull the dev group (mypy / pytest / ruff). Codegen needs only the base package, so skip
    # dev for every uv invocation here — the Linux `check` gate owns that tooling (mirrors the iOS
    # `codegen (xcuitest)` job).
    env:
      UV_NO_DEV: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the Android toolchain
        uses: ./.github/actions/setup-android-toolchain

      - name: Cache AVD
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-pixel6-mem8192-cores2

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -memory 8192 -cores 2 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Layer 3, bracketing the emulator step — see `smoke`'s own pair for why it can be a step.
      - name: Start host telemetry
        uses: ./.github/actions/collect-android-diagnostics
        with:
          phase: start

      # `e2e-codegen` regenerates the .kt, then `connectedA11yDebugAndroidTest` builds/installs the app +
      # instrumentation APKs and runs the generated test against the one booted emulator.
      - name: Codegen + run native UI Automator test (adb)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        env:
          # Reached by exactly one hook on this lane, unlike the six `bajutsu run` jobs: no adb driver
          # runs at test time, so the resident-read trigger cannot fire, but the host-side recorder
          # (`demos/showcase/android/screenrecord.py`) confirms its recording is producing bytes and
          # captures when it is not. That is the case this lane's known flake actually looks like —
          # an empty tree right after launch, which a black recording and an idle compositor explain.
          BAJUTSU_STALL_DIAGNOSTICS: ${{ github.workspace }}/runs/diagnostics/stalls
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -memory 8192 -cores 2 -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          # The device-side sweep runs from inside this step, on the preserved `rc` — see `smoke`'s
          # own `script:` for why it cannot be a later step. This job needs it more than the six
          # `bajutsu run` jobs, not less: every path it uploads below is produced by Gradle *running
          # the test*, so a failure before that point — a wedged AVD boot, a codegen or build error,
          # the job's own `timeout-minutes` — left `if-no-files-found: ignore` to drop the artifact
          # silently, and the job that failed outside its own test uploaded nothing at all.
          script: >-
            make -C demos/showcase/android e2e-codegen
            ; rc=$?
            ; scripts/collect_android_diagnostics.sh "$rc" || true
            ; exit $rc

      - name: Collect host telemetry
        if: always()
        uses: ./.github/actions/collect-android-diagnostics
        with:
          phase: collect

      # `androidTest-results/` carries Gradle's own per-test logcat;
      # `connected_android_test_additional_output/` carries the `codegen-diagnostics/` the generated
      # test dumps on failure — the window hierarchy, a screenshot, and the accessibility window list
      # with the ids the selector could actually be matched against. `screenrecord/` (added for this
      # lane's known flake: the accessibility tree reporting empty right after launch, or a system
      # dialog taking the foreground window — which `e2e-codegen` now also suppresses at the source
      # with `hide_error_dialogs`, so a recurrence is unlikely to still be that dialog) is a full-motion
      # recording of the install+test window, `adb pull`ed by the Makefile's `e2e-codegen` target
      # itself — only on a failing test, so a green run leaves this path absent by design (and
      # best-effort besides: `if-no-files-found: ignore` covers a failed pull the same as the other
      # paths here). A timed-out wait reports only that nothing matched, so without these a failure
      # can be investigated only by re-running it until it happens again.
      - name: Upload androidTest report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: android-e2e-codegen-report
          path: |
            demos/showcase/android/compose/build/reports/androidTests/
            demos/showcase/android/compose/build/outputs/androidTest-results/
            demos/showcase/android/compose/build/outputs/connected_android_test_additional_output/
            demos/showcase/android/compose/build/outputs/screenrecord/
            runs/
          if-no-files-found: ignore

  # Single required status check for the Android lane — the Android twin of ios-e2e.yml's `E2E`.
  # Always runs so it reports even when the KVM jobs are skipped (a PR that can't affect the adb
  # path) — a skipped dependency is a pass; only a real failure or cancellation fails the gate.
  # `network` joins `smoke`/`conformance` in `needs:`: its pass/fail is a deterministic,
  # host-independent fact (was the exchange observed?), so a regression there must fail the required
  # check like the other two — it is path-gated the same way, so a skip is still a pass. `golden`,
  # `visual`, `codegen`, and `fault-injection` remain deliberately excluded (see the header): the
  # element-tree golden can drift with an upstream dependency, a pixel baseline is host-specific, and the
  # codegen (BE-0294) and fault-injection (BE-0305) lanes land as per-PR signals first (the
  # signal-then-required precedent of BE-0282) — each is promoted into `needs:` only once stable. Make `E2E (android)` the
  # required check, not the path-gated KVM jobs.
  #
  # `changes`'s own result is checked too, not just the KVM jobs': `changes` has no `if:`, so it
  # always runs and never reports `skipped` — but if it *fails* (e.g. a misconfigured `E2E_LANE`,
  # `scripts/e2e_changes.py` raising on an unrecognized lane), `smoke`/`conformance` are skipped as a
  # side effect of the failed dependency, not of a genuine path-skip, and a check that only inspected
  # them would read that as a pass — the required gate reporting green having run nothing.
  e2e:
    name: E2E (android)
    needs: [changes, smoke, conformance, network]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check E2E results
        env:
          CHANGES: ${{ needs.changes.result }}
          SMOKE: ${{ needs.smoke.result }}
          CONFORMANCE: ${{ needs.conformance.result }}
          NETWORK: ${{ needs.network.result }}
        run: |
          echo "changes=$CHANGES smoke=$SMOKE conformance=$CONFORMANCE network=$NETWORK"
          for result in "$CHANGES" "$SMOKE" "$CONFORMANCE" "$NETWORK"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "E2E (android) failed"
              exit 1
            fi
          done
          echo "E2E (android) passed (or skipped — no adb-relevant change)"
