version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current (Dependabot bumps the pin + the version
  # comment). Grouped so all action bumps land in one PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days after a release before opening a PR — a fresh version has had time to
    # surface yanks/regressions, reducing supply-chain risk from a just-published bump.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Python dependencies (pyproject.toml: runtime + dev extras).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  # The npm lockfiles are tooling-only (the textlint runtime the prose skills run, and the web
  # demo's codegen helper) — without these entries their transitive advisories
  # accumulate unwatched, since neither directory is reachable from pyproject.toml.
  - package-ecosystem: npm
    directory: /tools/textlint
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      textlint:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /demos/web/codegen
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      codegen:
        patterns: ["*"]
    # `@playwright/test` is pinned to the Python `web` extra's Playwright version (uv.lock) so the
    # codegen job reuses the Chromium build cached under the `uv.lock` key. Dependabot sees only the
    # npm side, and moving it alone breaks that pair silently — `codegen-e2e` installs its own
    # browser, so nothing turns red while every run re-downloads Chromium. Bump it by hand together
    # with uv.lock. This withholds the automatic PR, not the alert, and leaves transitives in scope.
    ignore:
      - dependency-name: "@playwright/test"
