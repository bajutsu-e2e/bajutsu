name: Collect Android host diagnostics
description: >-
  Sample the Linux runner's own load for the whole of an android-e2e.yml job (BE-0367 Layer 3). A
  `start` phase before the job's emulator step launches a background sampler; a `collect` phase after
  it stops the sampler. It reads only the *host* — never the device — which is what lets it be a
  composite action at all: the emulator lives only inside the `reactivecircus/android-emulator-runner`
  step, so device-side collection has to run from inside that step's own `script:`
  (`scripts/collect_android_diagnostics.sh`) instead. Bracketing that step from outside is also what
  lets this cover a job whose emulator step died outright, which a sampler launched inside it could
  not. The log lands under `runs/diagnostics/`, which each job's existing `Upload run artifacts` step
  already carries.

inputs:
  phase:
    description: >-
      'start' to launch the sampler before the emulator step, 'collect' to stop it afterwards. Any
      other value is a no-op, so a typo cannot silently leave a job unsampled *and* green — the
      missing log says so.
    required: true
  interval:
    description: >-
      Seconds between samples. ~20s is deliberately a tenth of the `poll_cpuinfo` sampler's 2s
      cadence and issues no adb traffic at all, so — unlike that opt-in poller — this one has no
      observer effect on the contention it measures and stays always-on.
    required: false
    default: '20'

runs:
  using: composite
  steps:
    - name: Start the host telemetry sampler
      if: inputs.phase == 'start'
      shell: bash
      env:
        INTERVAL: ${{ inputs.interval }}
      run: |
        mkdir -p runs/diagnostics
        nohup bash -c 'while true; do
          {
            date -u +%Y-%m-%dT%H:%M:%SZ
            top -bn1 2>&1 | head -20
            free -m 2>&1
            # top -bn1 reports CPU averaged since boot; the second of two samples measures the last
            # second, including I/O wait and hypervisor steal. Prefixed so the telemetry parser
            # prefers it.
            top -bn2 -d1 2>/dev/null | grep "^%Cpu" | tail -1 | sed "s/^/Interval /"
          } >>runs/diagnostics/host-telemetry.log 2>&1
          sleep "$1"
        done' _ "$INTERVAL" >/dev/null 2>&1 &
        # The pid file is deliberately outside `runs/`, so bookkeeping never rides along into the
        # uploaded artifact.
        echo $! >"$RUNNER_TEMP/bajutsu-host-telemetry.pid"

    - name: Stop the host telemetry sampler
      if: inputs.phase == 'collect'
      shell: bash
      run: |
        pidfile="$RUNNER_TEMP/bajutsu-host-telemetry.pid"
        if [ -f "$pidfile" ]; then
          kill "$(cat "$pidfile")" 2>/dev/null || true
          rm -f "$pidfile"
        fi

    # One machine-readable record per job, written on green jobs too (docs/ci.md, "Measuring a flaky
    # lane across runs"). It re-reads only what the job already wrote under `runs/`, so it costs well
    # under a second and needs no device. System `python3`: the script is stdlib-only.
    - name: Write the CI telemetry record
      id: telemetry
      if: inputs.phase == 'collect'
      shell: bash
      run: |
        set +e
        script="${GITHUB_ACTION_PATH:-.github/actions/collect-android-diagnostics}/../../../scripts/ci_telemetry.py"
        if python3 "$script" summarize --lane android --runs runs --out runs/diagnostics/ci-telemetry; then
          echo "name=ci-telemetry-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}-$(date +%s)-${RANDOM}" >>"$GITHUB_OUTPUT"
        else
          echo "::warning::bajutsu diagnostics: the CI telemetry record was not written"
        fi
        exit 0

    # A small artifact of its own, so the cross-run report never downloads a run's videos.
    - name: Upload the CI telemetry record
      if: inputs.phase == 'collect' && steps.telemetry.outputs.name != ''
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ steps.telemetry.outputs.name }}
        path: runs/diagnostics/ci-telemetry/
        if-no-files-found: ignore
