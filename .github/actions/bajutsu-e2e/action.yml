name: bajutsu E2E
description: >-
  Run bajutsu scenarios against an already-booted Simulator with the XCUITest backend,
  then upload the run (report.html, screenshots, video, network.json) as an artifact.
  The caller is responsible for building and installing the app (and the XCUITest runner)
  first; this action owns the bajutsu-specific part (run — with the entry-screen convention score
  folded in via `--score` — and artifacts). The run step passes `--erase`, so the Simulator is wiped
  before the run: the target must set `appPath`, since that reinstall is what puts the app back after
  the caller's own out-of-band install is erased. Erase is a simctl operation, so a
  `xcuitest.deviceType: device` target fails loudly at lease time
  (bajutsu/platform_lifecycle/environments/xcuitest.py); no current caller targets a real device
  through this action.

inputs:
  scenarios:
    description: >-
      Scenario *.yaml file(s) to run, whitespace-separated. Each is passed as its own
      `run --scenario`, so several run in one `bajutsu run` process — but the run step's `--erase`
      forces every one of them onto its own cold XCTest-host spawn (the warm-runner reuse gate is
      `not preconditions.erase`), so the cold startup is paid once per scenario, not once for the
      step. A single path is the common case.
    required: true
  exclude:
    description: >-
      Comma list; skip scenarios carrying any of these tags (passed as `run --exclude`). Empty
      (the default) runs every scenario in the file.
    required: false
    default: ""
  target:
    description: Target key in bajutsu.config.yaml.
    required: true
  udid:
    description: Simulator UDID (or "booted" for the current one).
    required: false
    default: booted
  backend:
    description: Actuator backend.
    required: false
    default: xcuitest
  config:
    description: Path to bajutsu.config.yaml.
    required: false
    default: bajutsu.config.yaml
  artifact-name:
    description: Name for the uploaded run artifacts.
    required: false
    default: bajutsu-run

runs:
  using: composite
  steps:
    # The XCUITest backend needs no pip extra (its runner is driven over HTTP, and `xcodebuild` is a
    # system tool that ships with Xcode on the macOS runner) — so the run path is the base install.
    # --no-dev: never the dev group (mypy / pytest / ruff and the gate-only extras
    # bedrock/server/worker/db/oauth/mcp); those belong to the Linux `check` gate.
    - name: Sync dependencies
      shell: bash
      run: uv sync --no-dev

    # Inputs go through env: so the shell sees them as data, not as script text spliced in
    # before parsing (the GitHub Actions ${{ }} injection pattern). See BE-0123.
    #
    # `--score` folds the entry-screen convention score (doctor's Ready/Partial/Blocked tell) into the
    # run's own first launch, so the log carries the diagnostic that a separate `doctor` step used to
    # print — but without cold-spawning a second XCUITest runner (the run already holds a live lease).
    # It writes to stderr and never affects pass/fail; the deterministic verdict stays `run`'s alone.
    - name: Run scenarios
      shell: bash
      env:
        SCENARIOS: ${{ inputs.scenarios }}
        EXCLUDE: ${{ inputs.exclude }}
        TARGET: ${{ inputs.target }}
        UDID: ${{ inputs.udid }}
        BACKEND: ${{ inputs.backend }}
        CONFIG: ${{ inputs.config }}
      run: |
        # Expand the whitespace-separated SCENARIOS into one --scenario per file, so several run in
        # one process and reuse a single warm runner (scenario paths never contain spaces, so plain
        # word-splitting is safe). A single path yields a single --scenario, unchanged.
        scenario_args=()
        for s in $SCENARIOS; do scenario_args+=(--scenario "$s"); done
        uv run --no-sync bajutsu run "${scenario_args[@]}" --exclude "$EXCLUDE" --target "$TARGET" \
          --udid "$UDID" --backend "$BACKEND" --config "$CONFIG" --erase --score

    # Collect any macOS crash reports the run produced into the uploaded artifact, so a resident-
    # runner mid-run crash is diagnosable even when the pipeline's scenario-level retry recovers it
    # (the run then passes and would otherwise leave no crash trace). Reads
    # ~/Library/Logs/DiagnosticReports (the XCTest host / app crash `.ips` land there). Best-effort
    # (`always`, errors swallowed): no reports is the normal healthy case, so a missing directory or
    # zero matches must never fail the job.
    - name: Collect crash diagnostics
      if: always()
      shell: bash
      run: |
        dest="runs/diagnostics"
        mkdir -p "$dest"
        cp -f ~/Library/Logs/DiagnosticReports/*.ips "$dest"/ 2>/dev/null || true
        cp -f ~/Library/Logs/DiagnosticReports/*.crash "$dest"/ 2>/dev/null || true
        found=$(find "$dest" -type f 2>/dev/null | wc -l | tr -d ' ')
        echo "crash diagnostics collected: $found file(s) in $dest"

    # artifact-name is a `with:` value on a `uses:` step, not a shell `run:` block, so the
    # ${{ }} injection pattern does not apply — no env: indirection needed here (BE-0123).
    - name: Upload run artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: runs/
        if-no-files-found: ignore
