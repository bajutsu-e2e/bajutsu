name: bajutsu E2E
description: >-
  Run bajutsu scenarios against an already-booted Simulator with the XCUITest backend,
  then upload the run (report.html, screenshots, video, network.json) as an artifact.
  The caller is responsible for building and installing the app (and the XCUITest runner)
  first; this action owns the bajutsu-specific part (run — with the entry-screen convention score
  folded in via `--score` — and artifacts).

inputs:
  scenarios:
    description: >-
      Scenario *.yaml file(s) to run, whitespace-separated. Each is passed as its own
      `run --scenario`, so several run in one `bajutsu run` process sharing one warm XCUITest runner
      (the cold XCTest-host startup is paid once for the step, not once per scenario). A single path
      is the common case.
    required: true
  exclude:
    description: >-
      Comma list; skip scenarios carrying any of these tags (passed as `run --exclude`). Empty
      (the default) runs every scenario in the file.
    required: false
    default: ""
  target:
    description: Target key in bajutsu.config.yaml.
    required: true
  udid:
    description: Simulator UDID (or "booted" for the current one).
    required: false
    default: booted
  backend:
    description: Actuator backend.
    required: false
    default: xcuitest
  config:
    description: Path to bajutsu.config.yaml.
    required: false
    default: bajutsu.config.yaml
  artifact-name:
    description: Name for the uploaded run artifacts.
    required: false
    default: bajutsu-run

runs:
  using: composite
  steps:
    # The XCUITest backend needs no pip extra (its runner is driven over HTTP, and `xcodebuild` is a
    # system tool that ships with Xcode on the macOS runner) — so the run path is the base install.
    # --no-dev: never the dev group (mypy / pytest / ruff and the gate-only extras
    # bedrock/server/worker/db/oauth/mcp); those belong to the Linux `check` gate.
    - name: Sync dependencies
      shell: bash
      run: uv sync --no-dev

    # Host telemetry has to be running *before* the scenarios do, or a stall's correlation with host
    # load is unrecoverable after the fact (BE-0361 layer 3). It lives here rather than in each
    # calling job because `bundled-runner` invokes this action twice: a job-level start would be
    # stopped by the first invocation's collect, leaving the second run unsampled. On that second
    # invocation this step restarts the sampler the first collect stopped; the one-shot render probe
    # keeps its original pre-run reading rather than being re-taken mid-job.
    - name: Start iOS diagnostics
      uses: ./.github/actions/collect-ios-diagnostics
      with:
        phase: start
        udid: ${{ inputs.udid }}

    # Inputs go through env: so the shell sees them as data, not as script text spliced in
    # before parsing (the GitHub Actions ${{ }} injection pattern). See BE-0123.
    #
    # `--score` folds the entry-screen convention score (doctor's Ready/Partial/Blocked tell) into the
    # run's own first launch, so the log carries the diagnostic that a separate `doctor` step used to
    # print — but without cold-spawning a second XCUITest runner (the run already holds a live lease).
    # It writes to stderr and never affects pass/fail; the deterministic verdict stays `run`'s alone.
    - name: Run scenarios
      id: run
      shell: bash
      env:
        SCENARIOS: ${{ inputs.scenarios }}
        EXCLUDE: ${{ inputs.exclude }}
        TARGET: ${{ inputs.target }}
        UDID: ${{ inputs.udid }}
        BACKEND: ${{ inputs.backend }}
        CONFIG: ${{ inputs.config }}
      run: |
        # Expand the whitespace-separated SCENARIOS into one --scenario per file, so several run in
        # one process and reuse a single warm runner (scenario paths never contain spaces, so plain
        # word-splitting is safe). A single path yields a single --scenario, unchanged.
        #
        # No --erase/--no-erase override: neither target this action runs against
        # (demos/showcase/showcase.config.yaml's showcase-swiftui/showcase-uikit) sets a target-level
        # `erase` default, so an explicit --no-erase here would be a no-op for every scenario's own
        # lease — except a crash-triggered retry (bajutsu/runner/pipeline.py's forced-erase retry,
        # `force_erase_on_retry`), which *does* read the flag: an explicit --no-erase there means "the
        # operator asked to keep the device as-is," and this composite action is not that operator, so
        # passing it here would silently disable the device recovery this step exists to benefit from
        # on the exact jobs (golden/actuation/run/bundled-runner) the 2026-08-06 incident named.
        scenario_args=()
        for s in $SCENARIOS; do scenario_args+=(--scenario "$s"); done
        uv run --no-sync bajutsu run "${scenario_args[@]}" --exclude "$EXCLUDE" --target "$TARGET" \
          --udid "$UDID" --backend "$BACKEND" --config "$CONFIG" --score

    # Replaces the crash-report copy this step used to be (BE-0361). That sweep read only `.ips` /
    # `.crash` under ~/Library/Logs/DiagnosticReports, and collected zero files on every run of the
    # failure class it was meant to explain: the resident runner's mid-run death crashes no process,
    # so there is no report to find. The composite action widens the sweep and adds the Simulator,
    # CoreSimulator, and host state that failure actually leaves behind, gating the expensive half on
    # whether the run above failed. Still best-effort and still `always()`: a healthy run collecting
    # little is the normal case and must never fail the job.
    - name: Collect iOS diagnostics
      if: always()
      uses: ./.github/actions/collect-ios-diagnostics
      with:
        phase: collect
        udid: ${{ inputs.udid }}
        failed: ${{ steps.run.outcome != 'success' }}

    # artifact-name is a `with:` value on a `uses:` step, not a shell `run:` block, so the
    # ${{ }} injection pattern does not apply — no env: indirection needed here (BE-0123).
    - name: Upload run artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: runs/
        if-no-files-found: ignore
