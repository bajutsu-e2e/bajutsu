name: Set up the Android toolchain
description: >-
  The four steps every android-e2e.yml job starts with, in one place: install uv, pin JDK 17, warm
  the Gradle cache, and make KVM world-accessible for the hardware-accelerated emulator. Callers
  still own their own checkout (a local action needs the repo present to resolve) and their own
  `uv sync` (the extras differ per job — base, or the visual extra, or none), so this action covers
  only the identical prelude those steps share.

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        enable-cache: true

    # Gradle needs JDK 17 (demos/showcase/android targets jvmTarget 17); pin it explicitly rather
    # than lean on whichever JDK the runner image defaults to.
    - name: Set up JDK 17
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5.6.0
      with:
        distribution: temurin
        java-version: '17'

    # Cache the Gradle build across runs (the committed wrapper drives the build; this only warms
    # its caches, so a miss just rebuilds cold and never changes the result).
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92  # v6.2.0

    # KVM must be world-accessible for the emulator to be hardware-accelerated on the Linux runner.
    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
