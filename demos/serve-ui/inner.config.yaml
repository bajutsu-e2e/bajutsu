# The config the *inner* serve (the WebUI under test, on :8799) loads, so its pickers have real
# targets to show. `web` mirrors demos/web/demo.config.yaml's target unchanged — its scenarios are
# demos/web's own, read in place — so every dogfood scenario that drives the web target sees exactly
# what it saw when the inner serve loaded that file. demos/web keeps its config to itself.
targets:
  web:
    platform: web
    app: { url: "http://127.0.0.1:8787/index.html" }
    paths: { scenarios: ../web/scenarios }
    evidence:
      redact:
        fields: [password]
  # An Android target that exists only to be fanned out (BE-0465): replay-device-cloud.yaml picks it
  # with a faked device-cloud worker, dispatches its two placeholder scenarios through run-set, and
  # cancels them. No worker ever leases those jobs, so nothing installs `app.path` or runs the
  # scenarios; and since this config's scenarios travel as files on disk, dispatch never reads it.
  # The pickers list targets sorted by name, so the `zz-` prefix keeps `web` the default the other
  # dogfood scenarios assert.
  zz-fanout-android:
    platform: android
    app:
      id: com.example.bajutsu.fanout
      path: fanout/placeholder.apk
    paths: { scenarios: fanout/scenarios }
