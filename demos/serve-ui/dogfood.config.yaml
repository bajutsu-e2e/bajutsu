# Config for dogfooding the bajutsu `serve` Web UI itself. The "app under test" is the serve
# SPA — identified by `subject.url`, driven by the Playwright (web) backend. Like demos/web this needs no
# Mac and no Simulator. The `hooks` pair below brings the inner serve up for the run, so
# `bajutsu run --target webui` is self-contained — `make -C demos/serve-ui e2e` just runs.
targets:
  webui:
    platform: web
    subject:
      url: "http://127.0.0.1:8799/"
      # The data-testid namespaces the WebUI exposes (the web equivalent of accessibility ids).
      idNamespaces: [nav, view, record, replay, crawl, author, stats, coverage, settings, config, upload]
    # Bring up the inner serve (the WebUI under test) on :8799 for the run, then tear it down — so
    # the run needs no hand-started server. The start script reuses a server already answering
    # :8799 untouched, and hands its process id to the teardown through $BAJUTSU_OUTPUT, so only a
    # server this run started is stopped (BE-0491). The inner serve loads inner.config.yaml
    # (demos/web's target, so its dropdowns show a real app + scenario, plus an Android target the
    # device-cloud fan-out dogfood dispatches), confines its file browser to demos/serve-ui via
    # --root, and serves runs from the committed crawl-history fixture (BE-0181) so the Crawl
    # History tab has a deterministic past run to reopen.
    hooks:
      beforeRun:
        - name: server
          cmd: "./demos/serve-ui/scripts/start-inner-serve.sh"
          timeout: 60
      afterRun:
        # `on` defaults to `always`, which is what a teardown wants, so it is left unwritten.
        - cmd: "./demos/serve-ui/scripts/stop-inner-serve.sh"
    paths: { scenarios: scenarios }
