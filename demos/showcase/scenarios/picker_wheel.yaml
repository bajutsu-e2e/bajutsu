# Wheel pickers: set a wheel to an exact value. On iOS (BE-0356) that is a `UIPickerView` and a
# wheel-mode `UIDatePicker`; on Android (BE-0480) an `android.widget.NumberPicker` and a spinner-mode
# `DatePicker`, whose fields are `NumberPicker` wheels too. `setPickerValue` is the only step that can —
# a wheel's rows are not separately addressable elements, so `tap` cannot reach one, and `swipe` /
# `drag` / `scroll` / `tapPoint` are coordinate actions that cannot guarantee stopping on a named row.
# XCUITest's `adjust(toPickerWheelValue:)` acts on the resolved element instead, and the adb backend's
# resident server steps the resolved wheel one row at a time through accessibility scroll actions,
# reading the row back after each — which is what makes both deterministic. The web backend lacks the
# `pickerWheel` capability, so preflight rejects the scenario up front there.
#
# The `swiftui` tag is a separate gate for a separate reason: preflight rejects a *backend* that
# lacks a capability, but it cannot see that an *app* lacks a screen. On iOS only the SwiftUI
# showcase app renders SHOWCASE_PICKERS, so the bulk UIKit and Flutter iOS lanes exclude the tag
# (demos/showcase/Makefile) and `tests/test_showcase_fixtures.py` asserts every scenario here keeps
# carrying it — the scenario schema has no file-level `tags`, so each one repeats it. Both Android
# apps render the screen, and the Android lanes list this file by name
# (demos/showcase/android/Makefile).
#
# The SHOWCASE_PICKERS launch env swaps the app for a flat, scroll-free picker screen (see the iOS
# PickerView and the Android PickerScreen), mirroring the SHOWCASE_GESTURES affordance: both wheels
# are then always in the accessibility tree, so the run never depends on swipe-to-scroll.
#
# Both selectors carry the `pickerWheel` trait because an identifier never lands on a wheel: SwiftUI
# puts it on the picker, whose wheel is a separate child, and on Android a `NumberPicker`'s own node
# carries no resource-id, so the id names a container around it. Each `id` lists the dotted SPEC form
# and the underscore form a Views `android:id` needs (BE-0221).
#
# The date picker is the multi-component case. It lays out three sibling `pickerWheel` children,
# none carrying an identifier of its own, so each is addressed by the `within` / `traits` / `index`
# fields every selector already carries — one step per component, rather than a second addressing
# mechanism of `setPickerValue`'s own. Only two of the three are set here; the day wheel between them
# is left alone, which is itself the point that `index` picks out one component rather than the
# picker as a whole. `within` scopes by frame containment and iOS reports these wheels taller than the
# picker holding them, so `form.birthdate` names a container built to enclose them (see the iOS
# PickerView) rather than the date picker itself.
#
# Both the wheel *order* and the row *labels* follow the locale the run pins. Nothing here overrides
# it, so it is the config default `en_US` (`Defaults.locale`), under which the wheels read
# month | day | year in English on both platforms — hence `index: 0` / `"May"` and
# `index: 2` / `"2016"`. Do not translate these values without also changing the scenario's
# `locale`: they name rows the platform renders, not strings the app owns. `form.birthdate.value` is
# deliberately `YYYY-MM` instead, so the assertion reads a projection the app controls rather than a
# localized label.
- name: setPickerValue moves a single-component wheel to an exact value
  tags: [swiftui]
  preconditions:
    subject:
      launch:
        env: { SHOWCASE_UITEST: "1", SHOWCASE_PICKERS: "1" }
  steps:
    - wait: { for: { id: [form.school, form_school] }, timeout: 10 }
      capture: [deviceLog]
    - assert:
        - value: { sel: { id: [form.school.value, form_school_value] }, equals: "高校" }
    - setPickerValue:
        sel: { within: { id: [form.school, form_school] }, traits: [pickerWheel] }
        value: "大学"
      capture: [rawTree]
  expect:
    - value: { sel: { id: [form.school.value, form_school_value] }, equals: "大学" }

- name: setPickerValue addresses each component of a multi-component wheel
  tags: [swiftui]
  preconditions:
    subject:
      launch:
        env: { SHOWCASE_UITEST: "1", SHOWCASE_PICKERS: "1" }
  steps:
    - wait: { for: { id: [form.birthdate, form_birthdate] }, timeout: 10 }
      capture: [deviceLog]
    - assert:
        - value: { sel: { id: [form.birthdate.value, form_birthdate_value] }, equals: "2015-04" }
    - setPickerValue:
        sel: { within: { id: [form.birthdate, form_birthdate] }, traits: [pickerWheel], index: 0 }
        value: "May"
      capture: [rawTree]
    - setPickerValue:
        sel: { within: { id: [form.birthdate, form_birthdate] }, traits: [pickerWheel], index: 2 }
        value: "2016"
  expect:
    - value: { sel: { id: [form.birthdate.value, form_birthdate_value] }, equals: "2016-05" }
