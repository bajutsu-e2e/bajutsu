# Native alert (UIAlertController style `.alert` / SwiftUI `.alert`): the Log tab's fifth modal
# style, distinct from modals.yaml's action sheet. It carries two actions, "Cancel" and "OK", so a
# scenario can prove both are independently reachable and produce distinct outcomes. Both actions
# carry an `id` in the a11y build (`log.alert.cancel` / `log.alert.ok`), so this file addresses them
# the same way every other scenario addresses a control; the -noax twin has none, which is why the
# label + traits route stays the documented fallback in SPEC §5.3.
#
# Kept in its own file rather than folded into the shared modals.yaml: unlike that file's other
# three modal styles, no Android (Compose/Views) or Flutter Log screen has a matching native-alert
# affordance yet, and modals.yaml is swept unfiltered into every one of those targets
# (`scenarios: scenarios` in showcase.config.yaml, plus explicit per-file scenario allowlists on
# the Android/Flutter Makefiles). Tagged `alert` so `make run-flutter` — which runs every file in
# `scenarios/` bar its own `--exclude` list — can skip it the same way; Android's Makefiles simply
# never list this file's basename in their own allowlists.
- name: native alert can be tapped
  tags: [alert]
  preconditions:
    launchEnv: { SHOWCASE_UITEST: "1" }
  steps:
    - tap: { label: "Log", traits: [button] }
      capture: [deviceLog]
    - wait: { for: { id: log.openDelete }, timeout: 10 }
    # Open Alert sits below Open Delete, past the fold (same as log.openDelete itself in the
    # action-sheet scenario in modals.yaml) — aim the scroll at the lower of the two new elements.
    - scroll: { to: { id: log.alert.value }, direction: down }
    - wait: { for: { id: log.openAlert }, timeout: 5 }
    - assert:
        - value: { sel: { id: log.alert.value }, equals: "none" }
    - tap: { id: log.openAlert }
    - wait: { for: { id: log.alert.ok }, timeout: 5 }
    - assert:
        - exists: { id: log.alert.cancel }
    - tap: { id: log.alert.ok }
    - wait: { until: { gone: { id: log.alert.ok } }, timeout: 5 }
  expect:
    - value: { sel: { id: log.alert.value }, equals: "ok" }

- name: native alert cancel leaves a distinct result
  tags: [alert]
  preconditions:
    launchEnv: { SHOWCASE_UITEST: "1" }
  steps:
    - tap: { label: "Log", traits: [button] }
      capture: [deviceLog]
    - wait: { for: { id: log.openDelete }, timeout: 10 }
    - scroll: { to: { id: log.alert.value }, direction: down }
    - wait: { for: { id: log.openAlert }, timeout: 5 }
    - tap: { id: log.openAlert }
    - wait: { for: { id: log.alert.cancel }, timeout: 5 }
    - tap: { id: log.alert.cancel }
    - wait: { until: { gone: { id: log.alert.cancel } }, timeout: 5 }
  expect:
    - value: { sel: { id: log.alert.value }, equals: "cancel" }
