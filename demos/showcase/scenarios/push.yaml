# Device-environment step on every device backend: deliver a push notification to the app, then
# re-assert the settled screen (the push does not change the foreground UI, so the Stable catalog is
# still shown). iOS delivers it with `simctl push`; Android maps the same APNs payload on the host and
# hands it to BajutsuAndroid's in-app push receiver (BE-0498), so one file runs on both. Each id lists
# both its dotted SPEC form (iOS / Compose) and its underscore form (Android Views), so the selector
# resolves whichever tree renders (BE-0221). The foreground-banner fixture lives in push_banner.yaml:
# it needs `handleSystemAlert` and a SwiftUI-only launch environment, and the Android lanes run each
# file whole. push_android.yaml asserts what the Android app's handler saw.
#   bajutsu run --scenario push.yaml --target showcase-swiftui ...
#   bajutsu run --scenario push.yaml --target showcase-compose --backend android ...
- name: receive a push notification
  tags: [system]
  preconditions:
    subject:
      launch:
        env: { SHOWCASE_UITEST: "1" }
  steps:
    - wait: { for: { id: [stable.row.1, stable_row_1] }, timeout: 10 }
    - push: { payload: { aps: { alert: "You have a new message" } } }
  expect:
    - exists: { id: [stable.row.1, stable_row_1] }
