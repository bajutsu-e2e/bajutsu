# iOS's *real* "Save Password" alert, raised from the app's own text fields rather than from a page
# the in-app browser loaded — the other of the two routes iOS offers to save a credential from, and
# the one save_password_browser.yaml does not reach.
#
# The two routes differ in what they require and in what they put on screen, both measured on an
# iOS 18.6 Simulator:
#   - The browser route needs nothing beyond a page to sign in to; the alert arrives as `app.alerts`
#     with three buttons ("Save Password", "Never for This Website", "Not Now").
#   - This one needs Password AutoFill's associated-domain check to pass, and the alert arrives as a
#     bottom sheet (`app.sheets`) with two ("Save Password", "Not Now").
# Both reach the app's own tree as identifier-less labelled buttons, and `springboard.alerts` sees
# neither, so both are cleared by the guard's in-tree dismissal and by nothing else.
#
# `make -C demos/showcase e2e-savepassword-native` is what makes this runnable: it generates a
# throwaway certificate authority, serves `apple-app-site-association` over HTTPS from
# `localtest.me:8443`, and installs that authority into the Simulator's keychain. Without all three
# no prompt appears at all — declaring the entitlement alone is not enough (measured). That apparatus
# is why this lane is separate from every other showcase run, which needs only a built app.
#
# iOS (XCUITest) only, and `systemalert`-tagged so the bulk lanes never pick it up: they stand up
# none of the above, so the alert this scenario exists for would simply never appear there.
- name: clear iOS's save-password alert from the app's own sign-in screen
  tags: [systemalert]
  systemAlertHandling:
    # The save prompt is not one the locale table covers, so it is answered through the ordered
    # candidates — which is also what arms the in-tree dismissal at all.
    labels: ["Not Now"]
  preconditions:
    launchEnv:
      SHOWCASE_UITEST: "1"
      # Swaps the whole UI for the native sign-in screen, so no other scenario's tab bar moves.
      SHOWCASE_SIGNIN: "1"
  steps:
    - wait: { for: { id: signin.username }, timeout: 20 }
    - assert:
        - value: { sel: { id: signin.value }, equals: "idle" }
    - type: { text: "showcaseuser", into: { id: signin.username } }
    - type: { text: "Hunter2Showcase", into: { id: signin.password } }
    # Submitting resigns the fields and flips the screen to its signed-in state, which is the
    # "credential-bearing view went away" that Password AutoFill watches for.
    - tap: { id: signin.submit }
    # The signed-in screen, waited for *through* the alert rather than before it. iOS decides when to
    # offer to save, and the moment moves: measured, the alert lands before this condition on iOS 18.6
    # and after it on 26.3, 26.4 and 26.5. A guarded `for` wait is right whichever way that falls —
    # already true when no alert is up, and false while one covers the screen, which is exactly when
    # the in-tree dismissal runs and clears it. A `gone` wait on the alert's own button cannot serve:
    # before the alert appears it is already true, and the run walks straight into it.
    - wait: { for: { id: signin.value, value: "signedIn" }, timeout: 60 }
  expect:
    - value: { sel: { id: signin.value }, equals: "signedIn" }
    # The alert is gone and the app's own screen is readable again — which it would not be while a
    # sheet the guard could not clear was still up.
    - exists: { id: signin.signedIn }
