# Golden element-tree assertion (BE-0006), XCUITest path: pin the normalized representation of
# the Log tab's Entry controls — a text field, a value-mirrored stepper/toggle, and buttons.
# The Log tab is reached by tapping the native tab bar, which XCUITest does by label
# (the retired idb backend collapsed the tab bar into one opaque group, BE-0290), so this golden runs
# with `--backend ios` and its recorded tree is XCUITest's — distinct from golden.yaml's tree (BE-0107).
#
# Comparison is per-field, not whole-dict: exact for identifier / label / value, set-equal
# for traits, and a tolerant sanity check on frame (see bajutsu/golden.py). Re-record with the
# scratch flow in the BE-0079 item when a deliberate normalizer / control change moves a field.
- name: golden controls
  tags: [golden, controls]
  description: >-
    Assert the normalized element tree for the Log tab's Entry controls matches the
    recorded golden — a text field, a value-mirrored stepper/toggle, and buttons
    (identity, state, traits exact; frame sane).
  preconditions:
    launchEnv: { SHOWCASE_UITEST: "1" }
  steps:
    - tap: { label: "Log", traits: [button] }
      capture: [video]
    - wait: { for: { id: log.note }, timeout: 10 }
  expect:
    - golden: { path: controls.json }

# The same tree, recorded with the in-app touch visualization on: the invariance check for
# `bajutsu run --touch-markers`. The marker is a CALayer, which is not a UIResponder and conforms to
# no accessibility protocol, so it cannot enter the hierarchy `app.snapshot()` walks — and this
# scenario is what holds that claim to account, by asserting the *same* controls.json the scenario
# above asserts with the visualization off. A marker that ever leaked into the tree would fail here.
# It pairs with the scenario above deliberately: the tap is what makes a marker exist at all, so
# adding the launch env to a scenario that touches nothing (golden.yaml waits, and never taps)
# would prove nothing.
- name: golden controls with touch markers
  tags: [golden, controls]
  description: >-
    Assert that enabling the in-app touch visualization leaves the normalized element tree
    identical to the golden recorded without it.
  preconditions:
    launchEnv: { SHOWCASE_UITEST: "1", BAJUTSU_TOUCH_MARKERS: "1" }
  steps:
    - tap: { label: "Log", traits: [button] }
    - wait: { for: { id: log.note }, timeout: 10 }
  expect:
    - golden: { path: controls.json }
