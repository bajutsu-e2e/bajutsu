# The case BE-0406 was written from: a `handleSystemAlert` step placed for the notification prompt
# while iOS's save-password alert holds the screen, with no `wait` step placed to cover the
# interruption. Before that item the step's wait lived inside the XCUITest driver, where no guard
# could reach it, so the step spent its whole timeout polling `springboard.alerts` — a query the
# save-password alert is invisible to, since iOS raises it into the *app's* own process — and failed
# with `no system alert appeared within <timeout>s`. The wait now runs in the orchestrator, which
# drives the reactive guard once per poll, so the declared `savePassword` rule clears the
# interruption while the step is still waiting and the step goes on to answer the prompt it was
# placed for.
#
# The ordering is the mirror image of save_password_browser.yaml's, and it is what makes this
# scenario mean something. There the notification request is armed 8s after the browser opens, so it
# lands *first* and the save alert stacks under it — a SpringBoard alert on top, which the step's own
# native query would find straight away. Here the delay outlasts the sign-in, so the save alert lands
# first and holds the screen alone: measured, iOS raises no SpringBoard authorization alert over it,
# which is precisely why the step has nothing to find until something clears the save alert.
#
# The scenario cannot tap its way into that state — every element tap made while a system alert is
# showing fails by design — so `SHOWCASE_NOTIF_AFTER_BROWSER` has the app arm the second prompt on
# its own schedule, the same knob save_password_browser.yaml uses for the opposite ordering.
#
# `rules` names `savePassword` and nothing else, deliberately. Declaring `notifications` too would
# hand the prompt to the guard, and this scenario exists to prove the *step* answers it: the guard's
# native probe declines an alert the waiting step's own selector names (`probe_native`'s "reserved"
# answer), so the two never decide the same prompt in opposite directions.
#
# iOS (XCUITest) only. Tagged `browser` for the fixture page it needs (the bulk lanes serve none) and
# `systemalert` because it needs notification authorization still `notDetermined` and leaves the
# device decided for whatever runs after it.
- name: answer a notification prompt with handleSystemAlert while the save-password alert is up
  tags: [browser, systemalert]
  systemAlertHandling:
    # Name the intent, not the text (BE-0320/BE-0382). `savePassword` is the entry that arms the
    # in-tree dismissal, the one path that can reach an alert raised inside the app's own process.
    rules:
      - { prompt: savePassword, choice: deny }
    pollInterval: 5
  preconditions:
    launchEnv:
      SHOWCASE_UITEST: "1"
      # Served by `make -C demos/showcase e2e-savepassword`; keep the port in step with BROWSER_PORT.
      SHOWCASE_BROWSER_URL: "http://localhost:8799/login.html"
      # Long enough to outlast the sign-in *and* the save alert it raises (login.html holds its
      # submission 6s), so the request is raised into a screen the save alert already owns — the
      # opposite of save_password_browser.yaml's 8.
      SHOWCASE_NOTIF_AFTER_BROWSER: "25"
  steps:
    - tap: { label: "Permissions", traits: [button] }
    - wait: { for: { id: perm.requestNotif }, timeout: 10 }
    - assert:
        - value: { sel: { id: perm.notif.value }, equals: "notDetermined" }
    # The System section sits below Notifications + Location (as in browser.yaml).
    - scroll: { to: { id: sys.openBrowser }, direction: down }
    - tap: { id: sys.openBrowser }
    # Page content, rendered by the out-of-process browser: an accessibility tree, not a DOM, so the
    # form is addressed by the visible text iOS derives from each field's placeholder. The password
    # field is the page's only secure field, the one selector that never carries the credential.
    - wait: { for: { value: "Username", traits: [textField] }, timeout: 30 }
    - type: { text: "showcaseuser", into: { value: "Username", traits: [textField] } }
    - type: { text: "Hunter2Showcase", into: { traits: [secureTextField] } }
    - tap: { label: "Sign In", traits: [button] }
    # Straight into the step, with nothing between it and the sign-in that raises the interruption.
    # That is the whole point: the workaround this replaces was a `wait` step placed for no purpose
    # but to give the guard somewhere to run. The timeout has to span the submission the page holds,
    # the save alert's arrival, the guard's next poll clearing it, and the delay before the request
    # is raised — every one of them a condition this step waits on rather than sleeps through.
    - handleSystemAlert: { prompt: notifications, choice: deny, timeout: 90 }
    # The browser's own dismiss control, readable again now that both prompts are answered.
    - wait: { for: { id: Close }, timeout: 30 }
    # Back to the app under test, whose own tree carries the authorization the assertion reads.
    - tap: { id: Close }
    - wait: { for: { id: perm.notif.value, value: "denied" }, timeout: 20 }
  expect:
    # The regression assertion, and the only judgement in this file: "authorized" here means
    # XCUITest's default interruption handler tapped the prompt's default button ("Allow") instead of
    # the step answering it, which is what happens when nothing clears the save alert in time.
    - value: { sel: { id: perm.notif.value }, equals: "denied" }
