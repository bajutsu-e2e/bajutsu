# Text `adb shell input text` cannot carry: a non-ASCII character has no key in its character map, so
# this text takes the resident server's `/type`, and the plain ASCII among it stays on `input text`.
# The steps in a row prove the two routes compose in both orders: each one has to insert at the caret
# the last one left, and `/type` has to see the text `input text` just entered, or it would erase it.
# The last step is a literal `%s`, which `input text` would read as a space unless the driver splits it.
# Each id lists both its dotted SPEC form (Compose) and its underscore Android Views form, so the
# scenario runs unchanged on both.
#
# Tagged `android` so the iOS lanes exclude it: they sweep this directory, and this route is the adb
# backend's own. The android Makefile names this file explicitly, so the tag costs it nothing.
- name: non-ASCII text enters the focused field and keeps appending (android)
  tags: [android]
  preconditions:
    subject:
      launch:
        env: { SHOWCASE_UITEST: "1" }
  steps:
    - tap: { label: "Search", traits: [button] }
    - wait: { for: { id: [search.field, search_field] }, timeout: 10 }
    - type: { text: "馬", into: { id: [search.field, search_field] } }
    - type: { text: "術🐎" }
    - type: { text: " x" }
    - type: { text: "語" }
    - type: { text: " 100%sure" }
    - wait: { for: { id: [search.results-empty, search_results_empty] }, timeout: 5 }
  expect:
    # The adb backend reads an editable field's `text` as its `value` (#2388).
    - exists: { id: [search.field, search_field], value: "馬術🐎 x語 100%sure" }
