# iOS's *real* "Save Password" alert, stacked under the SpringBoard notification request — the pair
# whose ordering the reactive guard has to get right, and the one assertion that can tell the guard's
# answer from XCUITest's own.
#
# Where each prompt lives, measured on an iOS 18.6 Simulator:
#   - The save-password alert is raised by iOS for the sign-in below and reaches the *app's* tree:
#     `app.alerts`, three identifier-less labelled buttons ("Save Password", "Never for This
#     Website", "Not Now"). `springboard.alerts` never sees it, so `system_alert_labels()` reads
#     `absent` and only the guard's in-tree dismissal can clear it.
#   - The notification authorization request is a SpringBoard alert in another process, invisible to
#     the app's tree and answerable only through the native path.
# Nothing is simulated here: both prompts are the operating system's own. The browser route needs no
# associated domain, entitlement, or HTTPS — iOS offers to save a credential typed into a web form
# for the page's own origin, exactly as Safari does. (The app's own login screen is the other route
# iOS raises this alert from, and that one does need `webcredentials:` — see
# save_password_native.yaml.)
#
# What this asserts that no in-tree assertion could: `perm.notif.value` ends "denied". The guard's
# in-tree tap goes through `Driver.tap`, which resolves an element, and XCUITest answers whatever
# out-of-process alert is interrupting *before* it synthesizes such an interaction. Left to itself it
# answers with its own default handler, which taps the alert's *default* button — "Allow" — granting
# a permission this scenario refuses, with no step failing and no `AlertEvent` in the report. The
# runner registers a UI interruption monitor that claims the alert without touching it, so the only
# thing that can answer the notification request is the `rules` entry below. "denied" therefore means
# the guard answered; "authorized" means XCUITest did.
#
# The ordering is built by the app and the page, not by the scenario, because a scenario cannot tap
# its way into it: every element tap made while a system alert is showing fails by design. So
# `SHOWCASE_NOTIF_AFTER_BROWSER` arms the notification request 8s after the browser opens (a few
# seconds after the sign-in the steps drive), and login.html holds its submission 6s so the save
# alert lands *after* that. `pollInterval: 10` then leaves a wide window in which both are up before
# the guard's next probe — the window an ungated in-tree tap used to fire into. Every wait below is
# still a condition wait; the delays only move when those conditions become true.
#
# iOS (XCUITest) only. Tagged `browser` for the fixture page it needs (the bulk lanes serve none) and
# `systemalert` because it needs notification authorization still `notDetermined` and leaves the
# device decided for whatever runs after it.
- name: clear iOS's save-password alert stacked under the notification prompt
  tags: [browser, systemalert]
  systemAlertHandling:
    # Name the intent, not the text (BE-0320/BE-0382): the run resolves the label SpringBoard renders
    # under the pinned system language, so this file refuses the request on a Japanese Simulator too.
    # The save alert joins the same list rather than replacing it: the notification rule above is
    # what this scenario's `expect` depends on. `savePassword` is the entry that arms the in-tree
    # dismissal, the one path that can reach an alert raised inside the app's process (BE-0406).
    rules:
      - { prompt: notifications, choice: deny }
      - { prompt: savePassword, choice: deny }
    pollInterval: 5
  preconditions:
    launchEnv:
      SHOWCASE_UITEST: "1"
      # Served by `make -C demos/showcase e2e-browser`; keep the port in step with BROWSER_PORT.
      SHOWCASE_BROWSER_URL: "http://localhost:8799/login.html"
      SHOWCASE_NOTIF_AFTER_BROWSER: "8"
  steps:
    - tap: { label: "Permissions", traits: [button] }
    - wait: { for: { id: perm.requestNotif }, timeout: 10 }
    - assert:
        - value: { sel: { id: perm.notif.value }, equals: "notDetermined" }
    # The System section sits below Notifications + Location (as in browser.yaml).
    - scroll: { to: { id: sys.openBrowser }, direction: down }
    - tap: { id: sys.openBrowser }
    # Page content, rendered by the out-of-process browser: an accessibility tree, not a DOM, so the
    # form is addressed by the visible text iOS derives from each field's placeholder.
    - wait: { for: { value: "Username", traits: [textField] }, timeout: 30 }
    # The browser reports a web input with no label and its placeholder as the value, so the two
    # fields are addressed that way rather than by label. The password field is the page's only
    # secure field, which is the one selector that never carries the credential's own text.
    - type: { text: "showcaseuser", into: { value: "Username", traits: [textField] } }
    - type: { text: "Hunter2Showcase", into: { traits: [secureTextField] } }
    - tap: { label: "Sign In", traits: [button] }
    # The sign-in lands, and with it iOS's offer to save the credential. Both prompts are up over the
    # browser from here; the guard refuses the notification request natively, then clears the save
    # alert from the tree.
    - wait: { for: { label: "Bajutsu Signed In" }, timeout: 60 }
    # Then wait out the save alert. When each prompt lands is the operating system's business and it
    # moves between versions — measured, the notification request arrives while the sign-in is still
    # being typed on iOS 26.4 and 26.5 but after it on iOS 18.6 and 26.3, and on 26.4 the save alert
    # itself arrives after the page has already navigated. A `gone` wait is the one form that is
    # right whichever way that falls: already true when the alert has been cleared (or never came),
    # and guarded while it is up, so the in-tree dismissal runs here and clears it.
    - wait: { until: { gone: { label: "Not Now", traits: [button] } }, timeout: 60 }
    # The browser's own dismiss control, absent from the tree while the alert was modal over it.
    - wait: { for: { id: Close }, timeout: 30 }
    # Back to the app under test, whose own tree carries the authorization the assertions read.
    - tap: { id: Close }
    - wait: { for: { id: perm.notif.value, value: "denied" }, timeout: 20 }
  expect:
    # The regression assertion: "authorized" here means XCUITest's default interruption handler
    # answered the request instead of the guard.
    - value: { sel: { id: perm.notif.value }, equals: "denied" }
