# What showcase.config.yaml and showcase.bundled-runner.config.yaml share for the showcase SwiftUI
# a11y app (BE-0471). Three more configs drive the same bundle id and none of them extends this
# file. live/showcase.live.config.yaml and devicefarm/showcase.devicefarm.ios.config.yaml hold
# verbatim copies and cannot reach a file here — `../templates/` escapes their own suite root — so
# an edit here must be mirrored in both. demos/demo.config.yaml *could* reach
# `./showcase/templates/`, but deliberately does not, so it stays loadable on its own; its block is
# narrower on purpose (no `startWhen`, `idNamespaces` without `sys`), so do not mirror into it
# blindly. `subject.path` and
# `subject.build` stay in each config: a template's path resolves here, but its build command would run
# in the extending config's directory, so the pair would point at two places.
platform: ios
subject:
  launch: { env: { SHOWCASE_UITEST: "1" } }
  idNamespaces: [stable, horse, search, log, notice, perm, sys, net]
  # BE-0231: gate readiness on the first Stable row, in both id forms (BE-0221). This and
  # `idNamespaces` reach showcase-swiftui-bundled and the bundled-runner config's target alone:
  # showcase.config.yaml's own `showcase-swiftui` replaces both with supersets that add `saved`
  # (SPEC §5.6), and a list replaces rather than unions — so an edit here must be mirrored there.
  startWhen: { exists: { id: [stable.row.1, stable_row_1] } }
