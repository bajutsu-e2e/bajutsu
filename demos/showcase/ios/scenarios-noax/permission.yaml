# -noax twin of scenarios/permission.yaml. Runtime notification permission (notDetermined →
# authorized): tap Request Notifications, then assert the visible "Notifications: authorized" mirror
# (and the "Granted" text the app renders once authorized).
#
# Deterministic on iOS, exactly like the a11y twin: the SpringBoard prompt is out-of-process, so its
# buttons are resolved by the alert guard's native accessibility query rather than anything this
# build's app exposes — the identifier-less -noax app is no obstacle to that path. The grant is
# written as a `rules` entry, not `visionInstruction`, for the same reason the a11y twin is
# (BE-0406): a `visionInstruction` steers only the vision fallback, so the native tap would find no
# rule identifying the prompt and leave it alone, never granting it. It is kept for 1:1
# correspondence with the shared suite, not because iOS needs a separate gate here.
- name: grant notification permission
  tags: [permission, system]
  systemAlertHandling: { rules: [{ prompt: notifications, choice: grant }] }
  preconditions:
    launchEnv: { SHOWCASE_UITEST: "1" }
  steps:
    - tap: { label: "Permissions", traits: [button] }
    - wait: { for: { label: "Request Notifications", traits: [button] }, timeout: 10 }
    - assert:
        - exists: { label: "Notifications: notDetermined" }
    - tap: { label: "Request Notifications", traits: [button] }
    - wait: { for: { label: "Granted" }, timeout: 10 }
  expect:
    - exists: { label: "Notifications: authorized" }
