# -noax twin of scenarios/push.yaml. Device step: deliver a push, then re-assert the settled screen
# (the push does not change the foreground UI, so the Stable catalog is still shown — confirmed by the
# visible "Horse 1" row). simctl delivers it here; Android runs scenarios/push.yaml through
# BajutsuAndroid's push receiver (BE-0498). Run over XCUITest (`--backend ios`).
- name: receive a push notification
  tags: [system]
  preconditions:
    subject:
      launch:
        env: { SHOWCASE_UITEST: "1" }
  steps:
    - wait: { for: { label: "Horse 1" }, timeout: 10 }
    - push: { payload: { aps: { alert: "You have a new message" } } }
  expect:
    - exists: { label: "Horse 1" }
