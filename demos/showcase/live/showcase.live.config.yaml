# Bajutsu config for the showcase SwiftUI app on a reserved iOS device behind a live Appium /
# WebDriver endpoint (BE-0238 live route).
#
# It mirrors the `showcase-swiftui` target from ../showcase.config.yaml with one deliberate
# difference, which is per-environment and so lives in config (the app-agnostic principle), not in
# the tool: **no `subject.path` / `subject.build` and no `driver.runner`.** The reserved device already
# carries the build, and the live route speaks W3C WebDriver rather than the XCUITest runner channel,
# so no local `.app` or `.xctestrun` is assembled.
#
# Which grid serves the device is not the target's to say (BE-0452): it is infrastructure, so the
# `appium` environment of the worker.yaml beside this file names the endpoint. A run under that file
# hands the endpoint to this target as its device, and Bajutsu drives it over the live WebDriver
# transport — routed entirely around the simctl / xcodebuild machinery, which structurally cannot
# carry a URL. The device is one the grid boots and installs the build onto, so the run neither boots
# nor installs through simctl.
#
# The scenarios, ids, and launch env match the local target so the same suite runs unchanged. What
# the live WebDriver transport cannot drive is narrowed away up front (BE-0238 Slice C): the
# `select` / `copy` text-selection steps, the whole `DeviceControl` family, and the simctl-privacy
# permission grants have no faithful `mobile:` command, so preflight (BE-0082) skips a scenario that
# needs one rather than failing late — leaving the tap / query / gesture / input flows the endpoint
# does drive. Point the worker.yaml's `endpoint` at your own grid before running:
#   bajutsu run --target showcase-swiftui-live --config demos/showcase/live/showcase.live.config.yaml \
#     --worker-config demos/showcase/live/worker.yaml ...
targets:
  showcase-swiftui-live:
    platform: ios
    subject:
      id: com.bajutsu.showcase.ios.swiftui
      launch: { env: { SHOWCASE_UITEST: "1" } }
      idNamespaces: [stable, horse, search, log, notice, perm, sys, net]
      startWhen: { exists: { id: [stable.row.1, stable_row_1] } }
    paths: { scenarios: ../scenarios }
