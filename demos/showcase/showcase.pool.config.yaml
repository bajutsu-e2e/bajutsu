# Bajutsu config for the BE-0298 `pool (xcuitest)` job. Identical to `showcase-swiftui` in
# showcase.config.yaml EXCEPT that `defaults` carries no `capture:`, so the run falls through to the
# schema baseline (`screenshot.after` / `elements` / `actionLog`, bajutsu/config/schema.py) instead of
# the main config's `video`-on-top list. Video is dropped because that job's two failed runs both
# stalled in the capture pipeline: `recordVideo produced no new bytes … within 20.0s` on four
# scenarios, then a wedged `simctl terminate` / `uninstall` and an unreachable runner — BE-0361's
# host-exhaustion signature, whose `SimRenderServer` capture-service queue serves `simctl` video,
# screenshots, and the XCUITest `/screenshot` alike. Two devices on a 3-core / 7 GiB runner cannot
# afford a continuous recording per device on that queue.
#
# Video is all it can drop. The step screenshots (`before.png` / `after.png`) are recorded per leaf
# step by the run loop itself (BE-0341), not by this list, so no `capture:` value removes them —
# their cost is cut by the job's scenario set instead (ios-e2e.yml). Nor would removing them cost the
# verdict anything: `assert_pool_isolation.py` reads each result's artifact *names* and the run
# directory's listing, never a pixel, and the always-on `elements.json` names every step either way.
#
# Only `showcase-swiftui` is here — the one target that job runs. Kept separate from
# showcase.config.yaml, following showcase.bundled-runner.config.yaml's precedent, so every other
# lane's capture defaults stay untouched.
defaults:
  backend: [ios]
  device: "iPhone 17 Pro"
  reservedNamespaces: []

targets:
  showcase-swiftui:
    bundleId: com.bajutsu.showcase.ios.swiftui
    deeplinkScheme: showcaseswiftui
    launchEnv: { SHOWCASE_UITEST: "1" }
    idNamespaces: [stable, horse, search, log, notice, perm, sys, net]
    readyWhen: { id: [stable.row.1, stable_row_1] }
    appPath: ios/swiftui/build/dd/Build/Products/Debug-iphonesimulator/BajutsuShowcaseSwiftUI.app
    build: make swiftui-build
    scenarios: scenarios
    backend: [ios]
    xcuitest:
      testRunner: ../../BajutsuKit/Runner/build/dd/Build/Products/BajutsuRunner.xctestrun
      build: make runner-build
